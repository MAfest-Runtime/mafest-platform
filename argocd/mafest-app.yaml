# mafest API·웹 워크로드(M6 내부 배포). 승인 SHA로만 수동 Sync한다.
# 선행 조건은 scripts/argo-preflight.sh --sha <승인 전체 SHA> mafest-app. 정책(mafest-app-netpol)을 먼저 Sync한다 —
# 이 Application에는 NetworkPolicy가 없다.
#
# syncPolicy·finalizer를 두지 않는다(수동 Sync). 공개 HTTPRoute 전환은 이 Application에 넣지 않는다(M8).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mafest-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: application
spec:
  project: default
  source:
    repoURL: https://github.com/MAfest-Runtime/mafest-platform.git
    targetRevision: develop
    path: kustomize/overlays/prod/mafest-app
  destination:
    server: https://kubernetes.default.svc
    namespace: mafest-app
