# mafest-app namespace의 NetworkPolicy(API·웹·적재 Job).
# M6에서 API·웹 Sync보다 먼저 연결한다(allow wave 0 → default-deny wave 1). 적재 Job이 도는 중에는 Sync하지 않는다.
# 선행 조건은 scripts/argo-preflight.sh --sha <승인 전체 SHA> mafest-app-netpol.
#
# 짝 정책(이 Application 밖, 사람이 kubectl로 적용): traefik-networkpolicy의 allow-egress-backends(mafest-app 추가),
# persona-inference-netpol의 allow-vllm-gateway(소비자 mafest-api). mafest-data의 DB ingress는 이미 mafest-api를 받는다.
#
# syncPolicy·finalizer를 두지 않는다(수동 Sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mafest-app-netpol
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
spec:
  project: default
  source:
    repoURL: https://github.com/MAfest-Runtime/mafest-platform.git
    targetRevision: develop
    path: kustomize/overlays/prod/mafest-app-netpol
  destination:
    server: https://kubernetes.default.svc
    namespace: mafest-app
