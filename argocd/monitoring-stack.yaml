# H1 최소 모니터링. 이 Application 자체의 최초 등록과 이후 동기화는 수동이다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      targetRevision: 89.2.0
      helm:
        releaseName: monitoring-stack
        valueFiles:
          - $values/helm/values/monitoring-stack.yaml
    # ref source 이면서 path 를 가진다: values 파일을 읽을 뿐 아니라 이 경로(실험 관측 Grafana 대시보드
    # ConfigMap)도 같은 Application 이 렌더한다. 차트 source 는 바꾸지 않는다.
    - repoURL: https://github.com/MAfest-Runtime/mafest-platform.git
      targetRevision: develop
      ref: values
      path: kustomize/overlays/prod/grafana-dashboards
  syncPolicy:
    syncOptions:
      # kube-prometheus-stack의 큰 CRD는 client-side apply annotation 한도를 넘는다.
      - ServerSideApply=true
