# ClusterIssuer(letsencrypt-staging·letsencrypt-prod) 선언. cert-manager.yaml(CRD·컨트롤러)이
# 먼저 Sync돼 있어야 한다. CRD가 없으면 이 Application의 Sync는 실패한다(자동 Sync 없음).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager-issuers
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/MAfest-Runtime/mafest-platform.git
    targetRevision: develop
    path: kustomize/overlays/prod/cert-manager-issuers
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
