---
# `kubeadm join` **직전**의 읽기 전용 확인. 이 playbook은 Join하지 않고, token·CA hash를
# 받지도 않고, 어떤 설정도 바꾸지 않는다.
#
# 확인하는 것은 "Join을 실행할 수 있는 상태인가"까지다. 통과가 Join 성공이나 Cilium overlay
# 정상을 뜻하지 않는다 — Pod 간 통신은 Join 뒤 별도 행렬로 확인한다.
#
# token 존재 여부를 어떻게 확인하는가: 값을 받지 않고 **환경변수가 비어 있지 않은지만** 본다.
# 값을 vars로 받으면 로그와 `--diff`에 남는다. 실행하는 사람이
# `KUBEADM_TOKEN=... ansible-playbook ...` 형태로 넘기면 아래 검사는 길이만 본다.
- name: Read-only checks before kubeadm join
  hosts: gpu_nodes
  gather_facts: true
  become: true
  any_errors_fatal: true

  vars:
    # 둘 다 Join 직전에 클러스터에서 읽어 넘긴다(README "버전 입력의 의미"). 비어 있으면 실패한다 —
    # 버전 대조 없이 Join하지 않는다.
    # - api_server_version: `kubectl version -o json`의 serverVersion.gitVersion(예: v1.36.4).
    #   kubelet skew 판정의 기준이다.
    # - control_plane_kubelet_version: CP Node의 status.nodeInfo.kubeletVersion(예: v1.36.2).
    #   API server와 patch가 다를 수 있다 — 비교 기준이 아니라 drift 기록용이다.
    api_server_version: ""
    control_plane_kubelet_version: ""

  tasks:
    - name: 필요한 binary가 모두 있는지 확인
      ansible.builtin.command:
        cmd: "sh -c 'for bin in kubeadm kubelet containerd nvidia-smi tailscale; do command -v \"$bin\" >/dev/null || echo \"MISSING:$bin\"; done'"
      changed_when: false
      check_mode: false
      register: gpu_join_binaries

    - name: 빠진 binary가 없는지 확인
      ansible.builtin.assert:
        that:
          - "'MISSING:' not in gpu_join_binaries.stdout"
        fail_msg: >-
          Join 전제 binary가 빠졌다: {{ gpu_join_binaries.stdout_lines }}.
          10-base·20-tailscale·30-gpu-runtime를 먼저 끝낸다.

    - name: 버전 대조에 필요한 클러스터 값이 주어졌는지 확인
      ansible.builtin.assert:
        that:
          - api_server_version | length > 0
          - control_plane_kubelet_version | length > 0
        fail_msg: >-
          api_server_version과 control_plane_kubelet_version을 모두 넘긴다(예:
          `-e api_server_version=v1.36.4 -e control_plane_kubelet_version=v1.36.2`). 버전 대조 없이
          Join하지 않는다.

    - name: GPU host의 kubeadm·kubelet 버전 읽기
      ansible.builtin.command:
        cmd: "sh -c 'kubeadm version -o short; kubelet --version'"
      changed_when: false
      check_mode: false
      register: gpu_join_versions

    # 판정은 controller의 스크립트가 한다(files/kube_version_gate.py, 테스트 있음). 이전 판은
    # control-plane kubelet 문자열이 출력에 **포함되는지**만 봐서, 기준(API server)이 틀렸고
    # v1.36.2가 v1.36.21에도 걸렸다. 지금 규칙: GPU kubeadm·kubelet의 major.minor = API server,
    # GPU kubelet patch ≤ API server patch. CP kubelet과의 차이는 drift로 보고만 한다.
    # controller에서 돌리므로 become을 끈다.
    - name: API server 기준 버전 skew 판정
      ansible.builtin.command:
        argv:
          - python3
          - "{{ playbook_dir }}/../files/kube_version_gate.py"
          - join
          - --api-server
          - "{{ api_server_version }}"
          - --cp-kubelet
          - "{{ control_plane_kubelet_version }}"
          - --gpu-kubeadm
          - "{{ gpu_join_versions.stdout_lines[0] | default('') }}"
          - --gpu-kubelet
          - "{{ gpu_join_versions.stdout_lines[1] | default('') }}"
      delegate_to: localhost
      become: false
      changed_when: false
      check_mode: false
      # 위반이어도 여기서 멈추지 않는다 — 네 버전과 drift를 먼저 출력한 뒤 아래 assert가 멈춘다.
      failed_when: false
      register: gpu_join_version_gate

    - name: 네 버전의 patch와 drift 출력(통과·실패와 무관)
      ansible.builtin.debug:
        # 스크립트가 아예 실행되지 못하면 stdout이 비므로 stderr를 대신 보여 준다.
        msg: "{{ (gpu_join_version_gate.stdout | from_json) if gpu_join_version_gate.stdout | length > 0 else gpu_join_version_gate.stderr }}"

    - name: 버전 skew 판정 통과 확인
      ansible.builtin.assert:
        that:
          - gpu_join_version_gate.rc == 0
        fail_msg: >-
          버전 판정 실패(rc={{ gpu_join_version_gate.rc }}: 1=skew 위반, 2=형식 오류).
          판정: {{ gpu_join_version_gate.stdout }}{{ gpu_join_version_gate.stderr }}

    - name: swap이 꺼져 있는지 확인
      ansible.builtin.assert:
        that:
          - ansible_facts.swaptotal_mb | default(0) == 0
        fail_msg: "swap이 켜져 있다. kubelet이 기동을 거부한다."

    - name: containerd socket과 cgroup driver 확인
      ansible.builtin.command:
        cmd: "sh -c 'test -S /run/containerd/containerd.sock && echo socket-ok; grep -c \"SystemdCgroup = true\" /etc/containerd/config.toml'"
      changed_when: false
      check_mode: false
      register: gpu_join_containerd

    - name: containerd가 systemd cgroup driver인지 확인
      ansible.builtin.assert:
        that:
          - "'socket-ok' in gpu_join_containerd.stdout"
          - gpu_join_containerd.stdout_lines[-1] | int > 0
        fail_msg: >-
          containerd socket이 없거나 SystemdCgroup이 true가 아니다. 10-base를 다시 확인한다.

    # Join은 CP의 6443으로 나가는 연결이다. 여기서는 포트가 열려 있는지만 본다 — TLS SAN과
    # CA 검증은 Join 명령 자체가 하며, 그 검증을 건너뛰는 옵션은 쓰지 않는다.
    - name: control plane API 도달성 확인 (주소를 받은 경우에만)
      ansible.builtin.wait_for:
        host: "{{ control_plane_api_host }}"
        port: 6443
        timeout: 10
      when: control_plane_api_host is defined and control_plane_api_host | length > 0

    # Cilium VXLAN이 요구하는 포트. 여기서는 host의 방화벽이 막고 있지 않은지만 본다.
    # 실제 Pod 간 VXLAN 통신은 Join 뒤 §3 행렬로 확인한다.
    - name: host 방화벽이 VXLAN 포트를 막고 있지 않은지 읽기
      ansible.builtin.command:
        cmd: "sh -c 'command -v ufw >/dev/null && ufw status || echo \"ufw 없음\"; command -v nft >/dev/null && nft list ruleset | head -20 || echo \"nft 없음\"'"
      changed_when: false
      check_mode: false
      failed_when: false
      register: gpu_join_firewall

    # 값을 받지 않고 존재 여부만 본다. 이 검사는 token이 유효한지도, 만료되지 않았는지도
    # 알려주지 않는다 — 그건 Join 명령이 판정한다.
    - name: join token이 환경에 주어졌는지만 확인 (값은 읽지 않는다)
      ansible.builtin.assert:
        that:
          - lookup('ansible.builtin.env', 'KUBEADM_TOKEN') | length > 0
        fail_msg: >-
          KUBEADM_TOKEN 환경변수가 비어 있다. Join을 실행할 사람이 그 자리에서 넘긴다.
          이 playbook은 값을 저장하거나 출력하지 않으며 유효성·만료도 확인하지 않는다.
        success_msg: "join token 환경변수가 비어 있지 않다(값·유효성은 확인하지 않았다)."
      when: lookup('ansible.builtin.env', 'KUBEADM_TOKEN') is defined

    - name: Join 전 증거 표시
      ansible.builtin.debug:
        msg:
          binaries: "{{ gpu_join_binaries.stdout_lines | default(['모두 존재']) }}"
          versions: "{{ (gpu_join_version_gate.stdout | from_json) if gpu_join_version_gate.stdout | length > 0 else gpu_join_version_gate.stderr }}"
          containerd: "{{ gpu_join_containerd.stdout_lines }}"
          firewall: "{{ gpu_join_firewall.stdout_lines }}"
          note: >-
            이 playbook은 Join하지 않는다. 통과는 "Join을 실행할 수 있다"까지이며
            Cilium Pod overlay 정상을 뜻하지 않는다.
