# mafest 정본 DB(PostgreSQL 16 + Apache AGE 1.6). 문서 35 M5·11 §DB 규약을 따른다.
# operator 설치는 이 선언의 범위가 아니다 — bootstrap/cnpg/README.md를 먼저 따른다.
#
# 이미지는 승인된 릴리스 digest로 고정돼 있어 prod 렌더(kustomization.yaml resources)에 연결한다.
# 이미지를 바꿀 때는 태그가 아니라 승인된 릴리스의 digest로만 바꾼다 — 같은 태그가 다른 객체를 가리키면
# Cluster 재시작 때 다른 DB 이미지가 뜬다. ops-lab의 repos/persona-platform/tools/validate-mafest-data-manifests.sh가 digest 고정과
# "렌더에 자리표시자(0×64) 없음"을 함께 본다.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mafest-db
  labels:
    app.kubernetes.io/name: mafest-db
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: persona-platform
  annotations:
    # 앱 rollback이나 Application 정리가 DB 삭제로 번지지 않게 한다. local-path는 Retain이라 PV는
    # 남지만 Cluster가 지워지면 다시 세우는 절차가 필요하므로 Argo가 이 객체를 지우지 못하게 막는다.
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  # primary + replica 비동기 복제(문서 35 M5 "DB 2/2"). 필수 anti-affinity와 짝이라 워커가 한 대만
  # 남으면 인스턴스 하나만 뜬다 — 그 대가를 숨기지 않는다.
  instances: 2

  # mafest docker/postgres-age/Dockerfile 이미지(CNPG 16.15 standard + AGE 1.6.0 소스 빌드).
  # 태그는 CNPG가 major 버전을 읽게 남기고, digest로 실제 객체를 고정한다.
  # 릴리스 release-20261007-1(mafest 7cb9329d7691)의 승인 이미지.
  imageName: ghcr.io/mafest-runtime/mafest-postgres:16.15-age1.6.0-bookworm-7cb9329d7691@sha256:f0544ab73e405b4d6b115e21bf8376401a36f2d33074015b6491963f957e5c21
  # 비공개 GHCR 이미지. Secret 값은 Git에 없다 — 사람이 mafest-data에 mafest-ghcr를 만든다.
  imagePullSecrets:
    - name: mafest-ghcr

  # postgres superuser 계정을 활성화하지 않아 유출될 자격증명을 만들지 않는다.
  enableSuperuserAccess: false

  postgresql:
    # AGE는 preload가 필요하다 — runtime 계정은 LOAD 'age'를 할 수 없어(mafest db_pool.py, M1 실측)
    # 운영은 preload를 전제로 한다. CNPG는 shared_preload_libraries를 parameters가 아니라 이 필드로 받는다.
    shared_preload_libraries:
      - age
    parameters:
      # 짧은 조회 위주라 JIT 컴파일 비용이 이득보다 크다(문서 35 M5 "jit off").
      jit: "off"
      # 아래 셋은 문서 35 §DB "측정 출발 후보"(DB 1Gi 기준). 실측 뒤 조정한다.
      shared_buffers: 128MB
      work_mem: 4MB
      maintenance_work_mem: 64MB
      # API 2대 × (일반 풀 4 + 그래프 풀 2) = 12, 적재 Job 1개의 psql·loader 몇 개, operator·
      # 복제·exporter 연결, superuser 예약분을 합쳐 여유를 둔 출발값(문서 35: app+operator+replica+
      # loader+monitoring). 기본값 100보다 낮춰 1Gi 메모리 안에서 연결별 메모리 상한을 예측한다.
      max_connections: "64"

  bootstrap:
    initdb:
      database: mafest
      # 적재(loader)가 owner로 스키마·테이블·그래프를 만든다. API는 읽기 전용 mafest_runtime을 쓴다
      # (db/grants/mafest_roles.sql). 이름은 문서 11 §DB 규약을 따른다.
      owner: mafest_owner
      # 값은 Git에 없다. 사람이 mafest-data에 username/password 키로 만든다.
      secret:
        name: mafest-db-owner
      # 적재 첫 단계(verify_seed_locale)가 LC_CTYPE C.UTF-8을 요구하고, 정렬은 바이트 순서(C)로 둔다.
      localeCollate: C
      localeCType: C.UTF-8
      # 확장 생성은 superuser 권한이 필요하다(M1: owner로는 못 만든다). initdb 때 한 번만 실행된다.
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS age
        - CREATE EXTENSION IF NOT EXISTS pg_trgm

  # API가 쓰는 읽기 전용 역할. SQL로 만들지 않고 CNPG가 선언으로 만든다(비밀번호를 SQL·Git에 두지 않기 위해).
  # 비밀번호는 사람이 mafest-data에 만드는 Secret mafest-db-runtime(kubernetes.io/basic-auth, username=mafest_runtime,
  # password)에서 읽는다. 권한(CONNECT·ag_catalog USAGE·search_path·기본 권한)은 db/grants/mafest_roles.sql이 준다.
  managed:
    roles:
      - name: mafest_runtime
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: mafest-db-runtime
      # 멀티턴 확인 세션 저장소(스키마 mafest_confirm)에 쓰는 API 전용 역할. 특권이 없고 로그인만 한다.
      # 비밀번호는 사람이 mafest-data에 만드는 Secret mafest-db-session(kubernetes.io/basic-auth,
      # username=mafest_session, password)에서 읽는다. 테이블 권한은 SQL로 직접 주지 않고 마이그레이션 CLI
      # (`python -m mafest.session.migrate --apply --app-role mafest_session`)의 APP_GRANTS가 준다.
      # DB 접속(CONNECT)만 db/grants/mafest_roles.sql이 준다. 검색 runtime(mafest_runtime)과 역할·비밀번호를 섞지 않는다.
      - name: mafest_session
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: mafest-db-session
      # 세션 스키마(mafest_confirm) 전용 마이그레이션(DDL) 역할. 상품 owner(mafest_owner)를 쓰지 않는 이유:
      # `ALTER DEFAULT PRIVILEGES FOR ROLE mafest_owner ... TO mafest_runtime`(db/grants/mafest_roles.sql)은 owner 가
      # 어느 스키마에 만들든 적용돼, 새 세션 테이블(실행 키·질문 포함)을 검색 계정이 읽게 된다. 이 역할에는 그런 기본 권한을
      # 두지 않으므로 새 테이블은 이 역할만 소유하고 mafest_runtime·PUBLIC 은 접근하지 못한다.
      # 비밀번호는 사람이 mafest-data 에 만드는 Secret mafest-db-session-migrator(basic-auth)에서 읽는다. 특권 없음.
      - name: mafest_session_migrator
        ensure: present
        login: true
        inherit: true
        passwordSecret:
          name: mafest-db-session-migrator

  storage:
    # local-path는 allowVolumeExpansion=false라 나중에 못 늘린다. 문서 11 §DB "10Gi 권고".
    # 정본 데이터(stage·그래프) 적재 크기는 수백 MiB 수준이고 WAL·graph_next·인덱스 여유를 둔다.
    size: 10Gi
    storageClass: local-path

  # local-path 볼륨은 파드가 처음 스케줄된 노드에 고정된다. 두 홈 워커만 후보로 두고 CP·GPU 노드는
  # 제외한다. required anti-affinity로 두 인스턴스가 반드시 서로 다른 워커에 뜨게 한다.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-worker1
                  - k8s-worker2

  # 문서 35 §DB "DB 1Gi 측정 출발 후보". M1 실측은 적재 Job 쪽(stage 332MiB·graph 115MiB)이라
  # DB 자체 peak은 A7 적재 중에 잰다. 메모리는 requests=limits(OOM 경계 예측), CPU limit은 두지
  # 않는다(throttling이 곧 질의 지연이 된다). QoS는 Burstable이다 — persona-db와 같은 판단.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      memory: 1Gi
