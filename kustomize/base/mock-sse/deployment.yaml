apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-mock-sse
  labels:
    app.kubernetes.io/name: persona-mock-sse
    app.kubernetes.io/component: synthetic-sse-server
    app.kubernetes.io/part-of: persona-platform
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-mock-sse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: persona-mock-sse
        app.kubernetes.io/component: synthetic-sse-server
        app.kubernetes.io/part-of: persona-platform
    spec:
      automountServiceAccountToken: false
      # This Secret is created outside Git from a read-only GHCR package token.
      # It must exist before the private image can be pulled.
      imagePullSecrets:
        - name: persona-mock-sse-ghcr
      terminationGracePeriodSeconds: 15
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: mock-sse
          # The verified linux/amd64 child manifest. Never substitute a tag (including "latest")
          # or the parent OCI index digest.
          image: ghcr.io/mafest-runtime/persona-mock-sse@sha256:c467296f090f3868d32d82dda92ab2aaf75b096bae1ae0a0c1e1fde4bf58666d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: MOCK_SSE_GRACE_PERIOD_SECONDS
              value: "5"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 1
