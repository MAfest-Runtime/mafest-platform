# vLLM(Qwen/Qwen3-4B-Instruct-2507 @ cdbee75)을 GPU 노드에서 서빙한다.
#
# 상태: 운영자 제공 결과로 기동·비스트리밍 추론·Service 경유 SSE·Prometheus Target UP을 확인했다
# (2026-09-27). 성능·과부하는 측정하지 않았다 — 아래 초기값(GPU memory 비율, CPU·메모리)은 실측 전
# 값이며 성능을 보장하지 않는다.
#
# 모델은 seed Job이 모델 cache PVC에 받아 둔 것을 read-only로 읽는다. 이 Pod는 모델을 내려받지 않는다
# (offline env). initContainer가 seed 완료 marker·manifest·weight index를 확인하지 못하면 vLLM을
# 시작하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-vllm
  labels:
    app.kubernetes.io/name: persona-vllm
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: persona-platform
spec:
  # GPU 노드에는 GPU가 한 장뿐이고 기존 Pod가 그 한 장을 점유한다. RollingUpdate면 새 Pod가 같은 GPU를
  # 요청하며 기존 Pod가 끝나기를 기다려 Pending으로 남을 수 있으므로, 기존 Pod를 먼저 내리는 Recreate를
  # 쓴다. 교체 중 서빙 중단을 받아들인다. (RWO PVC 자체는 같은 노드의 여러 Pod가 함께 붙을 수 있어
  # Recreate의 이유가 아니다.)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  template:
    metadata:
      labels:
        # persona-inference NetworkPolicy(allow-vllm-gateway·metrics·dns)가 이 label을 고른다.
        app.kubernetes.io/name: persona-vllm
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: persona-platform
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        personaruntime.xyz/node-pool: gpu
      tolerations:
        - key: personaruntime.xyz/dedicated
          operator: Equal
          value: gpu-serving
          effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # image 기본 사용자는 root지만 이 Deployment는 non-root 10001 + read-only rootfs로 실행한다.
      # 이 조건의 GPU 기동과 추론은 운영자 제공 결과로 확인했다(2026-09-27).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # seed가 끝나지 않은 cache로 vLLM을 띄우지 않는다. 확인만 하고 GPU를 쓰지 않는다.
        - name: verify-model-cache
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dir=/models/Qwen/Qwen3-4B-Instruct-2507/cdbee75f17c01a7cc42f958dc650907174af0554
              for name in .persona-seed-complete.json .persona-seed-manifest.json model.safetensors.index.json; do
                if [ ! -s "$dir/$name" ]; then
                  echo "model cache not ready: missing $name" >&2
                  exit 1
                fi
              done
              if ! grep -q '"revision": "cdbee75f17c01a7cc42f958dc650907174af0554"' "$dir/.persona-seed-complete.json"; then
                echo "model cache marker revision mismatch" >&2
                exit 1
              fi
              echo "model cache verified"
          env:
            # CUDA image 기본 env는 NVIDIA_VISIBLE_DEVICES=all이다. nvidia RuntimeClass에서 이 값을
            # 물려받으면 GPU를 요청하지 않은 initContainer에도 GPU가 노출될 수 있다. void로 막는다.
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
        # 컴파일 cache 디렉터리에 non-root 10001이 쓸 수 있는지 확인한다. subPath 디렉터리는 kubelet이 처음
        # 만들 때 소유 때문에 쓰기가 막힐 수 있다(fsGroup이 적용되는 저장소인지에 달렸다). 못 쓰면 vLLM을
        # 띄우기 전에 여기서 멈춰, 컴파일 도중의 알기 어려운 오류 대신 원인을 바로 보이게 한다.
        # 확인만 하고 GPU를 쓰지 않는다.
        - name: prepare-compile-cache
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dir=/vllm-cache
              touch "$dir/.write-check" || { echo "compile cache not writable: $dir" >&2; exit 1; }
              rm -f "$dir/.write-check"
              echo "compile cache writable"
          env:
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: vllm-compile-cache
              mountPath: /vllm-cache
              subPath: vllm-cache
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          # 로컬 절대 경로만 쓴다. HF repo id를 주면 offline에서도 hub 조회를 시도할 수 있다.
          command:
            - vllm
            - serve
            - /models/Qwen/Qwen3-4B-Instruct-2507/cdbee75f17c01a7cc42f958dc650907174af0554
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Gateway가 요청 body의 model 값으로 쓸 이름(PERSONA_VLLM_MODEL). 경로 대신 모델 id로 노출한다.
            - --served-model-name
            - Qwen/Qwen3-4B-Instruct-2507
            # 입력+출력 16384 토큰. 기본값(모델 context 262144)은 L4의 KV cache(약 6.5만~7만 토큰)에
            # 들어가지 않아 기동에 실패한다. 추론 최적화 기준선(B0)에서 기본값과 다르게 두는 인자는 이것과 아래 --attention-backend 둘이다.
            # 8192 run(phase2-20261006T074432Z)에서 경계 채권·펀드(입력+출력 14,477·15,935)가 400이어서
            # 16384로 올렸다. 기동·KV 여유는 사람이 적용한 뒤 실측으로 확인한다.
            - --max-model-len
            - "16384"
            # attention 백엔드를 기본 선택(FLASH_ATTN) 대신 FLASHINFER로 고정한다. 같은 녹화 요청 80건을
            # 동시 1·2·4·8로 다시 보낸 B0 실측(vLLM 0.29.0, L4)에서 동시 1~2는 같고, 동시 4·8은 처리량이
            # 약 4~11% 늘고 TPOT p50이 조금 줄었다.
            # 대가: 같은 질문을 반복했을 때 해석 JSON이 달라지는 문항이 1/74에서 3/74로 늘었다.
            # 답변 문항 수와 오류 수는 같았다.
            # 측정 방법과 도구는 ops-lab의 experiments/LLM-02-baseline에 있다(결과 파일은 커밋하지 않는다).
            # vLLM을 올릴 때 이 선택이 여전히 이득인지 다시 잰다. 0.29.0에서 이 인자는 `vllm serve --help=all`의
            # AttentionConfig 절에 있고, 환경변수 VLLM_ATTENTION_BACKEND는 이 버전에 없다.
            - --attention-backend
            - FLASHINFER
            # 요청 내용을 로그에 남기지 않는다. vLLM v0.29.0에는 --disable-log-requests가 없고(모르는
            # 인자는 기동 실패) --enable-log-requests(기본 off)만 있으므로, 꺼짐을 명시한다.
            - --no-enable-log-requests
          env:
            # 재시작해도 외부 모델 다운로드·telemetry에 의존하지 않는다.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_DO_NOT_TRACK
              value: "1"
            # read-only rootfs에서 쓰기가 필요한 cache를 /tmp(emptyDir)로 보낸다.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            # torch.compile 결과를 재시작 뒤에도 쓰도록 모델 PVC의 하위 경로(vllm-cache)에 둔다. emptyDir에 두면
            # 재시작마다 컴파일을 다시 해서 기동이 길어진다(FP8-B 기준 컴파일 41초, 엔진 준비 63초 중).
            # cache 이름에는 vLLM 버전과 설정의 해시가 들어가 섞여도 안전하다. 그래도 vLLM 이미지를 바꿀 때는
            # 이 하위 경로를 지워도 된다(다시 컴파일할 뿐이다).
            - name: VLLM_CACHE_ROOT
              value: /vllm-cache
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            # CPU·메모리는 초기값이다(g6.xlarge: 4 vCPU, 16 GiB). 모델 적재 중 host 메모리 사용을 실측해 조정한다.
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              memory: 14Gi
              nvidia.com/gpu: 1
          # 모델 적재·CUDA graph 준비가 끝나야 /health가 성공한다. 최대 10분(10초 × 60회)을 기다린다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # Ready인 동안만 Service endpoint에 들어간다.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
            # 모델 PVC의 vllm-cache 하위 경로만 쓰기로 mount한다. 모델 디렉터리(/models)는 위처럼 계속 읽기 전용이다.
            - name: vllm-compile-cache
              mountPath: /vllm-cache
              subPath: vllm-cache
      volumes:
        # seed Job이 채운 cache. 서빙 중 쓰지 않는다.
        - name: model-cache
          persistentVolumeClaim:
            claimName: persona-vllm-model-cache
            readOnly: true
        # 같은 PVC를 쓰기 가능한 volume으로 한 번 더 둔다. /models용 volume은 volume 단위로 readOnly라서 그
        # volume의 mount를 쓰기로 바꿀 수 없다. 이 volume은 vllm-cache 하위 경로로만 mount한다.
        - name: vllm-compile-cache
          persistentVolumeClaim:
            claimName: persona-vllm-model-cache
        # 임시 파일과 HOME·XDG cache(컴파일 cache는 위 PVC로 옮겼다).
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        # PyTorch·vLLM 프로세스 간 공유 메모리. 컨테이너 기본 64Mi로는 부족할 수 있다.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
