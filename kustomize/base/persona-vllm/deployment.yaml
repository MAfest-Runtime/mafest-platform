# vLLM(Qwen/Qwen3-4B-Instruct-2507-FP8 @ 8591804, Qwen 공식 FP8 체크포인트)을 GPU 노드에서 서빙한다.
# BF16 @ cdbee75로 되돌리려면 kustomize/overlays/exp/persona-vllm-bf16을 쓴다.
#
# 상태: 운영자 제공 결과로 기동·비스트리밍 추론·Service 경유 SSE·Prometheus Target UP을 확인했다
# (2026-09-27). 성능·과부하는 측정하지 않았다 — 아래 초기값(GPU memory 비율, CPU·메모리)은 실측 전
# 값이며 성능을 보장하지 않는다.
#
# 모델은 seed Job이 모델 cache PVC에 받아 둔 것을 read-only로 읽는다. 이 Pod는 모델을 내려받지 않는다
# (offline env). initContainer가 seed 완료 marker·manifest·weight index를 확인하지 못하면 vLLM을
# 시작하지 않는다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: persona-vllm
  labels:
    app.kubernetes.io/name: persona-vllm
    app.kubernetes.io/component: inference
    app.kubernetes.io/part-of: persona-platform
spec:
  # GPU 노드에는 GPU가 한 장뿐이고 기존 Pod가 그 한 장을 점유한다. RollingUpdate면 새 Pod가 같은 GPU를
  # 요청하며 기존 Pod가 끝나기를 기다려 Pending으로 남을 수 있으므로, 기존 Pod를 먼저 내리는 Recreate를
  # 쓴다. 교체 중 서빙 중단을 받아들인다. (RWO PVC 자체는 같은 노드의 여러 Pod가 함께 붙을 수 있어
  # Recreate의 이유가 아니다.)
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  template:
    metadata:
      labels:
        # persona-inference NetworkPolicy(allow-vllm-gateway·metrics·dns)가 이 label을 고른다.
        app.kubernetes.io/name: persona-vllm
        app.kubernetes.io/component: inference
        app.kubernetes.io/part-of: persona-platform
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        personaruntime.xyz/node-pool: gpu
      tolerations:
        - key: personaruntime.xyz/dedicated
          operator: Equal
          value: gpu-serving
          effect: NoSchedule
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      # image 기본 사용자는 root지만 이 Deployment는 non-root 10001 + read-only rootfs로 실행한다.
      # 이 조건의 GPU 기동과 추론은 운영자 제공 결과로 확인했다(2026-09-27).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # seed가 끝나지 않은 cache로 vLLM을 띄우지 않는다. 확인만 하고 GPU를 쓰지 않는다.
        # 세 곳(이 스크립트의 dir=·revision, vllm 명령의 모델 경로)이 같은 모델·revision을 가리켜야 한다.
        # FP8 체크포인트는 weight index 없이 단일 model.safetensors라서 그 파일을 확인한다.
        - name: verify-model-cache
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              dir=/models/Qwen/Qwen3-4B-Instruct-2507-FP8/8591804019c8b22094c3b5b4454e0edc05dffc98
              for name in .persona-seed-complete.json .persona-seed-manifest.json model.safetensors; do
                if [ ! -s "$dir/$name" ]; then
                  echo "model cache not ready: missing $name" >&2
                  exit 1
                fi
              done
              if ! grep -q '"revision": "8591804019c8b22094c3b5b4454e0edc05dffc98"' "$dir/.persona-seed-complete.json"; then
                echo "model cache marker revision mismatch" >&2
                exit 1
              fi
              echo "model cache verified"
          env:
            # CUDA image 기본 env는 NVIDIA_VISIBLE_DEVICES=all이다. nvidia RuntimeClass에서 이 값을
            # 물려받으면 GPU를 요청하지 않은 initContainer에도 GPU가 노출될 수 있다. void로 막는다.
            - name: NVIDIA_VISIBLE_DEVICES
              value: void
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
      containers:
        - name: vllm
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          # 로컬 절대 경로만 쓴다. HF repo id를 주면 offline에서도 hub 조회를 시도할 수 있다.
          command:
            - vllm
            - serve
            - /models/Qwen/Qwen3-4B-Instruct-2507-FP8/8591804019c8b22094c3b5b4454e0edc05dffc98
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            # Gateway가 요청 body의 model 값으로 쓸 이름(PERSONA_VLLM_MODEL). 경로 대신 모델 id로 노출한다.
            - --served-model-name
            - Qwen/Qwen3-4B-Instruct-2507
            # 입력+출력 16384 토큰. 기본값(모델 context 262144)은 L4의 KV cache(약 6.5만~7만 토큰)에
            # 들어가지 않아 기동에 실패한다. 추론 최적화(B0)에서 기본값과 다르게 두는 인자는 이것과 아래 --speculative-config, --attention-backend 셋이다.
            # 8192 run(phase2-20261006T074432Z)에서 경계 채권·펀드(입력+출력 14,477·15,935)가 400이어서
            # 16384로 올렸다. 기동·KV 여유는 사람이 적용한 뒤 실측으로 확인한다.
            - --max-model-len
            - "16384"
            # CPU n-gram 추측 디코딩: 프롬프트에 이미 나온 문구를 이어 쓸 것으로 추측해 한 번에 여러 토큰을
            # 확인한다. 해석 JSON처럼 입력을 많이 되풀이하는 출력에서 크게 이득이다(추측 토큰 적중 품질 평가 구간 약 70%, 재전송까지 합치면 약 65%).
            # B0 실측(vLLM 0.29.0, L4, 같은 녹화 요청 80건): 동시 1에서 BF16+FLASHINFER 27.5 → 95.6 tok/s,
            # 동시 8에서 약 175 → 534 tok/s, TPOT p50 약 36~39ms → 10~13ms. 질문 1건 전체(DB 포함)는
            # p50 약 4.8 → 1.45초, p90 약 10.5~11 → 2.8초다. 84문항 평가에서 OK 판정 22/84가 같고 잃은 문항이 없었다.
            # (FP8-B 단독 효과는 같은 표의 FP8-B 열: 동시 1에서 44.9 tok/s.)
            # - 모델은 위 경로의 공식 FP8 체크포인트다. L4(sm_89)에서는 MarlinFP8ScaledMMLinearKernel로 돌아
            #   가중치만 FP8이고 계산은 BF16이다. 128×128 블록 배율용 FP8 행렬곱은 Hopper 이상에서만 된다.
            # - ngram_gpu는 쓰지 않는다. json_schema 출력과 동시 요청이 겹치면 vLLM이 "Failed to advance
            #   FSM ... Terminating request"로 요청을 생성 도중 끊는다(동시 2·4·8에서 80건 중 61·74·76건).
            #   CPU ngram은 같은 조건에서 0건이었다.
            # - 이 설정이면 vLLM이 async scheduling을 자동으로 끄고 Model Runner도 V2에서 V1으로 바뀐다.
            #   정상 동작이며 위 수치는 이 상태에서 잰 것이다.
            # - GPU 노드 CPU를 더 쓴다(동시 8에서 약 1.6코어, 이전 약 0.2코어. vCPU 4개).
            # - 기동 로그의 "max_num_scheduled_tokens is set to 2048" 경고는 측정 상태 그대로 둔다.
            # 측정 방법·도구·기록은 ops-lab의 experiments/LLM-02-baseline에 있다. vLLM을 올리면 다시 잰다.
            - --speculative-config
            - '{"method":"ngram","num_speculative_tokens":4,"prompt_lookup_min":2,"prompt_lookup_max":4}'
            # attention 백엔드를 기본 선택(FLASH_ATTN) 대신 FLASHINFER로 고정한다. 같은 녹화 요청 80건을
            # 동시 1·2·4·8로 다시 보낸 B0 실측(vLLM 0.29.0, L4)에서 동시 1~2는 같고, 동시 4·8은 처리량이
            # 약 4~11% 늘고 TPOT p50이 조금 줄었다.
            # 대가: 같은 질문을 반복했을 때 해석 JSON이 달라지는 문항이 1/74에서 3/74로 늘었다.
            # 답변 문항 수와 오류 수는 같았다.
            # 측정 방법과 도구는 ops-lab의 experiments/LLM-02-baseline에 있다(결과 파일은 커밋하지 않는다).
            # vLLM을 올릴 때 이 선택이 여전히 이득인지 다시 잰다. 0.29.0에서 이 인자는 `vllm serve --help=all`의
            # AttentionConfig 절에 있고, 환경변수 VLLM_ATTENTION_BACKEND는 이 버전에 없다.
            - --attention-backend
            - FLASHINFER
            # 요청 내용을 로그에 남기지 않는다. vLLM v0.29.0에는 --disable-log-requests가 없고(모르는
            # 인자는 기동 실패) --enable-log-requests(기본 off)만 있으므로, 꺼짐을 명시한다.
            - --no-enable-log-requests
          env:
            # 재시작해도 외부 모델 다운로드·telemetry에 의존하지 않는다.
            - name: HF_HUB_OFFLINE
              value: "1"
            - name: TRANSFORMERS_OFFLINE
              value: "1"
            - name: VLLM_NO_USAGE_STATS
              value: "1"
            - name: VLLM_DO_NOT_TRACK
              value: "1"
            # read-only rootfs에서 쓰기가 필요한 cache를 /tmp(emptyDir)로 보낸다.
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
            - name: VLLM_CACHE_ROOT
              value: /tmp/vllm-cache
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          resources:
            # CPU·메모리는 초기값이다(g6.xlarge: 4 vCPU, 16 GiB). 모델 적재 중 host 메모리 사용을 실측해 조정한다.
            requests:
              cpu: "2"
              memory: 8Gi
              nvidia.com/gpu: 1
            limits:
              memory: 14Gi
              nvidia.com/gpu: 1
          # 모델 적재·CUDA graph 준비가 끝나야 /health가 성공한다. 최대 10분(10초 × 60회)을 기다린다.
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          # Ready인 동안만 Service endpoint에 들어간다.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: dshm
              mountPath: /dev/shm
      volumes:
        # seed Job이 채운 cache. 서빙 중 쓰지 않는다.
        - name: model-cache
          persistentVolumeClaim:
            claimName: persona-vllm-model-cache
            readOnly: true
        # torch·vLLM 컴파일 cache와 임시 파일.
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
        # PyTorch·vLLM 프로세스 간 공유 메모리. 컨테이너 기본 64Mi로는 부족할 수 있다.
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
