# mafest 정본 데이터 적재 — --step stage. 문서 35 §적재 Job·M5b를 따른다.
# Argo 밖에서 사람이 runbook 단계에 맞춰 kubectl apply -k로 한 번만 실행한다. 순서는 stage → graph이고
# 둘을 동시에 돌리지 않는다(graph는 stage 결과를 읽는다). 끝난 Job은 지운 뒤 다음 단계를 켠다.
# 자원 근거: M1 실측 cgroup peak 331.5MiB(문서 M1 결과) × 1.3 ≈ 431MiB → 512Mi. 소요 28.0~42.9초 → activeDeadlineSeconds 600.
apiVersion: batch/v1
kind: Job
metadata:
  name: mafest-load-stage
  labels:
    app.kubernetes.io/name: mafest-loader
    app.kubernetes.io/component: load-stage
    app.kubernetes.io/part-of: persona-platform
spec:
  # 실패해도 다시 돌리지 않는다. 사람이 원인을 본 뒤 Job을 지우고 다시 켠다.
  backoffLimit: 0
  activeDeadlineSeconds: 600
  template:
    metadata:
      labels:
        # mafest-data NetworkPolicy(mafest-allow-db-ingress)가 이 라벨로 5432를 연다.
        app.kubernetes.io/name: mafest-loader
        app.kubernetes.io/component: load-stage
        app.kubernetes.io/part-of: persona-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # 비공개 GHCR 이미지. 값은 Git에 없다 — 사람이 mafest-app에 mafest-ghcr를 만든다.
      imagePullSecrets:
        - name: mafest-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 일반 작업처럼 홈 워커에서만 돈다(CP·GPU 노드 제외).
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: load
          # mafest 앱 이미지(Dockerfile, USER 10001, ENTRYPOINT 없음). 태그가 아니라 digest로 고정한다.
          image: ghcr.io/mafest-runtime/mafest-app@sha256:b84372f3ea8da7dcb277ed869e46f264be6bf1d0d158faf5dedf4b497ab5c22c
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -m
            - mafest.deploy.load
            - --step
            - stage
          env:
            # owner DSN(적재는 mafest_owner가 한다). 값은 Secret에만 있다.
            - name: PGURL
              valueFrom:
                secretKeyRef:
                  name: mafest-migrator
                  key: PGURL
            # 적재 끝에 이 역할에 읽기 권한을 다시 준다(mafest sql/grants/runtime_select.sql).
            - name: MAFEST_RUNTIME_ROLE
              value: mafest_runtime
            - name: MAFEST_ENABLE_VECTOR
              value: "0"
          resources:
            # 메모리는 requests=limits로 둔다. 적재 peak이 정해져 있어 축출 경계를 예측하기 쉽다.
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            # 적재는 승인된 stage 파일만 /tmp(mkdtemp)에 복사해 쓴다. 루트 파일시스템은 읽기 전용이다.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            # M1 /tmp peak 98.3MiB. 문서 M1 권장 "/tmp emptyDir ≥256Mi".
            sizeLimit: 256Mi
