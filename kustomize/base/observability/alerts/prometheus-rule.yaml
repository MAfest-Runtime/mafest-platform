# Gate 4 §5 — 알림 규칙. Alertmanager는 이 클러스터에서 꺼져 있다(tradeoff/04-observability.md,
# 해당 스택 미설치) — 이 PrometheusRule이 Sync돼도 아무 곳으로도 통지가 가지 않는다.
# Prometheus UI의 Alerts 탭에서 firing 상태를 눈으로 확인하는 용도로만 쓴다. 실제 페이징이
# 필요해지면 Alertmanager 도입을 먼저 하고 receiver를 연결한다 — 이 파일만으로는 안 된다.
#
# 이 리소스는 특정 컴포넌트 네임스페이스에 종속되지 않는다(ruleNamespaceSelector가
# 전체 네임스페이스를 보고 release 라벨로만 고른다) — traefik PodMonitor 옆에 둔 건
# 배치 편의이지 의미상 제약은 아니다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gate4-alerts
  labels:
    release: monitoring-stack
    app.kubernetes.io/part-of: persona-platform
spec:
  groups:
    - name: traefik-4xx-ratio
      rules:
        - alert: TraefikHigh4xxRatio
          # traefik_service_requests_total은 Traefik이 내는 표준 메트릭(v2·v3 동일 이름).
          # 5분 구간에서 4xx 비율이 30%를 넘으면 발화 — Alertmanager가 꺼져 있어 통지는
          # 안 가지만 Prometheus UI에서 확인할 수 있다.
          expr: |
            sum(rate(traefik_service_requests_total{code=~"4.."}[5m]))
              / sum(rate(traefik_service_requests_total[5m])) > 0.3
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Traefik 4xx 비율이 30%를 초과했다"
            description: "최근 5분간 Traefik이 처리한 요청 중 4xx 응답 비율이 30%를 넘었다. Alertmanager가 꺼져 있어 통지는 가지 않는다 — Prometheus UI에서 확인한다."
    - name: cert-manager-expiry
      rules:
        - alert: CertificateExpiringSoon
          # certmanager_certificate_expiration_timestamp_seconds는 cert-manager 컨트롤러가
          # 관리하는 각 Certificate의 만료 시각(unix epoch)을 낸다.
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time()) < 14 * 24 * 60 * 60
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: "인증서 만료가 14일 이내로 다가왔다 ({{ $labels.name }})"
            description: "{{ $labels.namespace }}/{{ $labels.name }} 인증서가 14일 안에 만료된다. cert-manager의 자동 갱신(기본 만료 30일 전 시도)이 실패했는지 확인한다. Alertmanager가 꺼져 있어 통지는 가지 않는다."
    - name: ingress-dns-colocation
      rules:
        # 같은 노드에 실제로 실행 중인 Pod만 센다. kube_pod_info에는 끝난(Succeeded/Failed) Pod와
        # 아직 노드가 없는 Pod도 남으므로 node가 비어 있지 않고 Running인 Pod로 좁히고,
        # 삭제 중인 Pod는 뺀다. kube_pod_deletion_timestamp가 노출되지 않으면 unless가 아무것도
        # 빼지 않아 삭제 중인 Pod를 세는 쪽으로만 틀린다(동거 오탐 가능, 놓치지는 않음).
        #
        # Traefik은 bootstrap/traefik/values.yaml의 필수 분산으로 원칙상 발화하지 않는다.
        # 이 규칙은 그 설정이 빠지거나 되돌려지는 회귀를 잡는 안전망이다.
        - alert: TraefikPodsColocated
          expr: |
            count by (node) (
              kube_pod_info{namespace="traefik", pod=~"traefik-.*", node!=""}
                and on (namespace, pod) (kube_pod_status_phase{namespace="traefik", phase="Running"} == 1)
                unless on (namespace, pod) kube_pod_deletion_timestamp
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Traefik Pod 2개가 같은 노드({{ $labels.node }})에 있다"
            description: "노드 하나가 멈추면 공개 진입이 Pod 재배치 전까지 끊긴다. Alertmanager가 꺼져 있어 통지는 가지 않는다 — Prometheus UI에서 확인한다."
        # CoreDNS는 kubeadm이 관리하는 Deployment라 이 저장소에서 배치를 고치지 않는다.
        # 쏠림을 보여 주기만 하고 재분산은 별도 판단이다.
        - alert: CoreDNSPodsColocated
          expr: |
            count by (node) (
              kube_pod_info{namespace="kube-system", pod=~"coredns-.*", node!=""}
                and on (namespace, pod) (kube_pod_status_phase{namespace="kube-system", phase="Running"} == 1)
                unless on (namespace, pod) kube_pod_deletion_timestamp
            ) > 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "CoreDNS Pod 2개가 같은 노드({{ $labels.node }})에 있다"
            description: "노드 하나가 멈추면 클러스터 DNS가 Pod 재배치 전까지 끊긴다. Alertmanager가 꺼져 있어 통지는 가지 않는다 — Prometheus UI에서 확인한다."
    # ddns-update(persona-edge, 5분 CronJob)가 가끔 `Could not resolve host`로 실패한다. 원인은
    # 아직 모른다 — Cilium DNS 프록시가 CoreDNS로 넘긴 질의의 응답이 돌아오지 않았다는 로그만
    # 있다. 이 그룹은 고치는 규칙이 아니라 **실패한 시점에 어디를 봐야 하는지** 알리는 규칙이다.
    - name: ddns-dns-failure
      rules:
        # failedJobsHistoryLimit이 1이라 실패한 Job이 다음 실패까지 남는다. 그대로 두면 오래전
        # 실패가 계속 발화하므로 Job 시작 시각이 30분 안인 것만 센다. Job이 실패로 확정되기까지
        # 재시도에 10분쯤 걸리므로 발화는 실제 첫 실패보다 늦다.
        - alert: DdnsUpdateJobFailed
          expr: |
            (kube_job_failed{namespace="persona-edge", job_name=~"ddns-update-.*", condition="true"} == 1)
              and on (namespace, job_name)
            (time() - kube_job_status_start_time{namespace="persona-edge", job_name=~"ddns-update-.*"} < 30 * 60)
          labels:
            severity: warning
          annotations:
            summary: "ddns-update Job {{ $labels.job_name }}이 실패했다"
            description: |-
              Alertmanager가 꺼져 있어 통지는 가지 않는다 — Prometheus UI에서 확인한다. 같은 시각 구간의 기록을 함께 남긴다.
              1) cilium-agent 로그: kubectl --context <ctx> -n kube-system logs -l k8s-app=cilium --since=30m --tail=-1 | grep "forwarded proxied DNS lookup"
              2) hubble_drop_total 사유별 증가: sum by (reason) (increase(hubble_drop_total[30m]))
              3) DNS 응답: sum by (rcode) (increase(hubble_dns_responses_total[30m]))
              4) src_valid_mark: node_sysctl_net_ipv4_conf_all_src_valid_mark (1이면 SrcValidMarkEnabled도 발화한다)
    - name: node-sysctl
      rules:
        # tailscaled는 시작할 때 이 값을 1로 켠다. 1이면 Cilium DNS 프록시 패킷이
        # IP_LOCAL_SOURCE로 조용히 버려진다(cilium/cilium#48706). 노드의 tailscaled drop-in이 0으로
        # 되돌리는데, 그 되돌림이 풀린 것을 바로 보이게 한다.
        - alert: SrcValidMarkEnabled
          expr: node_sysctl_net_ipv4_conf_all_src_valid_mark == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.instance }}의 src_valid_mark가 1이다"
            description: "tailscaled가 값을 다시 켰다. FQDN 정책 Pod의 DNS가 간헐적으로 실패할 수 있다. drop-in(10-cilium-srcmark.conf)과 `journalctl -u tailscaled`를 확인한다. Alertmanager가 꺼져 있어 통지는 가지 않는다."
