# persona-inference NetworkPolicy. 이 base를 가리키는 Argo Application이 없다 — 사람이
# control-plane에서 `kubectl apply -k`로 적용한다(절차: terraform/envs/prod/
# vllm-network-model-bootstrap-plan.md의 "첫 적용·복구 절차").
#
# 선택 기준은 namespace label + Pod label뿐이다. IP·Pod 이름을 정책 기준으로 쓰지 않는다 —
# Pod IP는 재시작마다 바뀌고 이름은 ReplicaSet 해시를 포함해 배포마다 달라진다.
#
# allow 정책도 격리를 시작한다. 어떤 정책이 한 Pod의 한 방향(Ingress/Egress)을 고르면 그
# 방향은 그 순간부터 정책들이 허용한 흐름만 남는다. 예: allow-vllm-gateway만 있으면 vLLM 인입은
# Gateway뿐이라 Prometheus 수집도 막히고, allow-model-seed-dns만 있어도 seed의 외부 HTTPS가 막힌다.
# default-deny는 그 격리를 모든 Pod·양방향으로 넓힐 뿐이다.
#
# 적용 순서: allow 4개를 먼저 넣어 확인하고, default-deny를 마지막에 넣는다.
# - sync-wave(allow "0", default-deny "1")는 Argo가 Sync할 때만 쓰는 순서다. `kubectl apply`는
#   이 annotation을 읽지 않는다.
# - 그래서 수동 적용용으로 `persona.runtime/apply-phase` label(allow·deny)을 붙였다. 이 label은
#   `kubectl apply -l`로 적용 묶음을 나누는 표시일 뿐이다. 정책 엔진은 label을 보지 않고 정책 사이에
#   평가 순서도 없다(허용의 합집합만 본다).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
    persona.runtime/apply-phase: deny
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # podSelector를 비워 namespace의 모든 Pod를 고른다. policyTypes 둘 다 적어야 ingress와
  # egress가 함께 막힌다 — 하나만 적으면 반대 방향은 정책이 없는 것과 같다.
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# vLLM 추론 ingress. mafest API Pod만 들어온다(persona 폐기 뒤 소비자를 persona-gateway에서 mafest-api로 옮겼다.
# 이름은 기존 정책과의 연속성을 위해 그대로 둔다 — 바꾸면 수동 적용 때 옛 정책이 남는다).
#
# 포트가 TCP 8000 하나인 근거: mafest API의 LLM 클라이언트는
# `{MAFEST_LLM_BASE_URL}/v1/chat/completions` 하나만 POST한다(mafest llm/client.py). 다른 포트·경로를 부르지 않는다.
#
# 보내는 쪽 허용은 mafest-app의 mafest-allow-api-egress다. 두 정책이 모두 있어야 통신된다.
# namespaceSelector와 podSelector는 같은 peer에 둔다(AND). 별도 `-` 항목으로 나누면 OR가 되어
# mafest-app의 모든 Pod(웹·적재 Job) 또는 이 namespace의 mafest-api 라벨 Pod가 들어올 수 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-gateway
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
    persona.runtime/apply-phase: allow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  # Ingress만 연다. vLLM이 Gateway로 먼저 연결할 일은 없으므로 egress는 default-deny
  # 그대로 둔다(아래 allow-vllm-dns가 여는 DNS가 유일한 예외다).
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mafest-app
          podSelector:
            matchLabels:
              app.kubernetes.io/name: mafest-api
      ports:
        - protocol: TCP
          port: 8000
---
# /metrics scrape. **추론 허용(allow-vllm-gateway)과 합치지 않는다.**
#
# vLLM은 API와 /metrics를 같은 8000에서 낸다. 포트가 같다는 이유로 위 allow-vllm-gateway의
# from에 monitoring을 더하면, 나중에 누가 그 규칙을 좁힐 때 수집이 함께 끊긴다. 목적이
# 다른 두 허용을 따로 둬서 각각 이유를 갖게 한다(mafest-app의 mafest-allow-api-ingress와
# mafest-allow-api-metrics를 나눈 것과 같은 판단).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-metrics
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
    persona.runtime/apply-phase: allow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  policyTypes:
    - Ingress
  ingress:
    - from:
        # monitoring namespace AND 실제 Prometheus Pod 라벨(같은 peer). namespace만 열면
        # monitoring의 Grafana·exporter 등 다른 Pod도 vLLM 추론 API에 닿는다 — 포트가 API와
        # 같아서 metrics만 여는 것이 불가능하기 때문이다.
        # - 라벨은 kube-prometheus-stack(release monitoring-stack)이 붙인 값이다. Pod 이름·
        #   IP·controller revision hash는 재시작·업그레이드마다 바뀌므로 쓰지 않는다.
        # - 이 라벨은 Helm 차트가 정하고 이 저장소가 선언하지 않는다. 차트 업그레이드로
        #   바뀌면 수집이 끊기고 Prometheus Target이 DOWN으로 보인다. 업그레이드 뒤 Target을
        #   확인하고 이 selector를 함께 고친다.
        # - NetworkPolicy는 L3/L4만 본다. Prometheus Pod에 TCP 8000을 열면 /metrics뿐 아니라
        #   추론 API 경로도 닿는다. 경로 단위 제한은 이 정책으로 하지 않는다.
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
          podSelector:
            matchLabels:
              app.kubernetes.io/name: prometheus
              app.kubernetes.io/instance: monitoring-stack-kube-prom-prometheus
      ports:
        - protocol: TCP
          port: 8000
---
# vLLM의 내부 이름 해석. 이것이 vLLM 운영 Pod의 **유일한** egress다.
#
# 모델 다운로드 egress가 여기 없는 것이 설계다. 모델은 seed Job이 미리 내려받아 PVC에
# 두고, vLLM은 그것을 read-only로 읽는다. 그래서 운영 Pod는 외부로 나갈 이유가 없다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vllm-dns
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
    persona.runtime/apply-phase: allow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# model cache seed Job의 DNS. vLLM과 **다른 Pod label**을 고른다.
#
# seed Job을 vLLM 라벨로 만들면 위 ingress·metrics 정책이 seed Pod에도 걸리고, 반대로 seed용
# egress가 vLLM에도 열린다. 둘의 라벨을 나누는 것이 그 사고를 구조적으로 막는다.
#
# 이 정책은 seed Pod의 Egress를 고르므로, default-deny 없이 이것만 적용돼도 seed의 송출은
# CoreDNS 53으로 제한되고 모델 호스트(HTTPS)에 닿지 못한다. seed가 외부 HTTPS에
# 닿는 길은 관측한 FQDN만 여는 별도 정책(network-policy-fqdn.yaml)뿐이다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-model-seed-dns
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
    persona.runtime/apply-phase: allow
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: persona-vllm-model-seed
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
