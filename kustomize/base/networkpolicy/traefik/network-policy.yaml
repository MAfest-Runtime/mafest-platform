# Gate 4 §3 — traefik 네임스페이스 default-deny + 최소 허용.
#
# 이 네임스페이스는 이 저장소의 Namespace 매니페스트가 아니라 helm install --create-namespace
# (bootstrap/traefik/README.md)로 만들어진다 — 그래도 Kubernetes가 자동으로 붙이는
# kubernetes.io/metadata.name 라벨은 그대로 있어 namespaceSelector로 참조할 수 있다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# 인터넷·LAN 인입. 포트는 Service의 exposedPort(80/443)가 아니라 Pod가 실제로 듣는
# entrypoint 포트다 — web=8000, websecure=8443(bootstrap/traefik/values.yaml ports.*,
# 렌더된 Gateway 리스너 포트와 동일). 80(web)의 "LAN 전용"은 공유기가 443만 포워딩해서
# 생기는 제약이지, 이 NetworkPolicy가 인터넷發 트래픽과 LAN發 트래픽을 구분해 8000만
# 막을 방법은 없다(둘 다 externalTrafficPolicy: Local로 실제 client IP를 그대로 본다) —
# 그 경계는 라우터가 지킨다.
#
# "+ host"(kubelet probe)는 이 정책에 넣지 않는다: Cilium 1.20.1이 routingMode: tunnel
# (veth, netkit 아님)이라 기본 설정(allow-localhost=auto)에서 노드发 kubelet
# liveness/readiness probe는 NetworkPolicy와 무관하게 항상 허용된다(Cilium 공식 문서 —
# https://docs.cilium.io/en/stable/security/policy/index.html). netkit 모드에서만 이
# 트래픽이 실제로 막히는 사례가 보고돼 있어(cilium/cilium#34042) 이 클러스터의 datapath
# 모드를 먼저 확인했다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-world
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
---
# 관측(Gate 4 §5) — monitoring 네임스페이스의 Prometheus가 PodMonitor
# (kustomize/base/observability/traefik/podmonitor.yaml)로 traefik Pod의 metrics 포트를
# 직접 스크레이프한다. 9100은 Traefik 차트 metrics entryPoint의 containerPort다 —
# ports.metrics.expose가 꺼져 있어(기본값) Service엔 없고 Pod에만 있다. 이 허용이
# 없으면 default-deny에 막힌다(실측 2026-09-20: traefik-observability 적용 후
# Prometheus 타깃 traefik/traefik이 down 2개, cert-manager는 up — persona-data의
# monitoring → postgres-exporter:9187 허용과 같은 패턴, network-policy.yaml의 그
# 규칙 참고).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-ingress-metrics
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9100
---
# 아웃바운드: 백엔드로 프록시할 세 네임스페이스(persona-app·persona-edge·mafest-app. mafest-app은 M6에서 API·웹 Service로 가는 길이다)(포트를 좁히지 않는다 — Traefik이 프록시하는
# 백엔드 포트가 HTTPRoute·Middleware 변경마다 늘어날 수 있어, 대상 네임스페이스 단위로
# 허용하고 실제 도달 가능한 포트는 각 백엔드 네임스페이스의 ingress 규칙이 이미 좁혀
# 놓았다 — 예: persona-web은 8080만 ingress를 받으므로 Traefik이 다른 포트로 실제로
# 말해도 상대쪽에서 막힌다), DNS, kube-apiserver(Gateway API 리소스 watch).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-backends
  labels:
    app.kubernetes.io/part-of: persona-platform
    app.kubernetes.io/component: networkpolicy
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persona-app
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: persona-edge
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: mafest-app
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
