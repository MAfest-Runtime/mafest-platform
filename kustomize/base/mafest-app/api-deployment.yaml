# mafest API(FastAPI·Uvicorn). 공개 API(/v1/*)·probe 경로(/healthz·/readyz)·Prometheus /metrics를
# 모두 아래 containerPort 8000 하나에서 제공한다(mafest Dockerfile CMD: uvicorn … --port 8000 --workers 1).
#
# 승인된 이미지 digest·설정으로 prod overlay(kustomize/overlays/prod/mafest-app)에 연결돼 있다. 값은 승인 입력이며
# scripts/validate-mafest-app-manifests.sh가 승인값과 다르면 실패한다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mafest-api
  labels:
    app.kubernetes.io/name: mafest-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: persona-platform
spec:
  # 두 대, Pod마다 Uvicorn process worker 1(이미지 CMD). 한 Pod 안에 worker를 늘리지 않는다 — 풀·메모리
  # 예산을 Pod 단위로 세기 때문이다.
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # 새 Pod가 Ready가 된 뒤 기존 Pod를 내린다. 그동안 잠깐 세 대가 되므로 메모리(limit×3)와 DB 연결
      # (Pod당 SQL 4 + AGE 2 = 6, 세 대 18)을 예산에 넣는다. DB max_connections는 64다.
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: mafest-api
  template:
    metadata:
      labels:
        # 이 라벨이 mafest-data의 mafest-allow-db-ingress(5432)와 맞물리는 계약이다. 바꾸면 DB 접속이 막힌다.
        app.kubernetes.io/name: mafest-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: persona-platform
    spec:
      # 이 앱은 Kubernetes API를 호출하지 않는다.
      automountServiceAccountToken: false
      # private GHCR package. 이 Secret은 Git 밖에서 사람이 만든다(값은 커밋·출력하지 않는다).
      imagePullSecrets:
        - name: mafest-ghcr
      # 종료 시간 배분(전부 이 유예 안에서 흐른다): preStop 10초 → SIGTERM → uvicorn graceful 100초 → 여유 10초.
      # 전체 요청 시한 90초(MAFEST_REQUEST_TIMEOUT_S)보다 길어야 진행 중 요청이 끝까지 간다.
      # preStop 대기도 유예 시간에 포함된다. SIGTERM 뒤 앱은 /readyz를 503으로 바꾼다. 실제 drain 동작은
      # 내부 배포 뒤 런북 절차로 확인하며, 이 선언만으로 검증됐다고 보지 않는다.
      terminationGracePeriodSeconds: 120
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # 정상 시 두 Pod를 서로 다른 워커에 둔다. 워커 하나가 빠지면 남은 워커에 함께 놓일 수 있다(분산보다
      # 서비스 유지 우선). DB의 required anti-affinity는 복사하지 않는다 — 워커 하나만 남으면 두 번째 API가
      # 영원히 Pending이 된다.
      # - nodeTaintsPolicy: Honor — cordon·NotReady taint가 붙은 노드를 분산 계산에서 뺀다.
      # - minDomains를 두지 않는다(=1). 2면 워커 하나만 남았을 때 두 번째 Pod가 늘 Pending이다.
      # - matchLabelKeys: pod-template-hash — 롤아웃 중 이전 revision Pod를 세지 않아 새 Pod끼리 나뉜다.
      topologySpreadConstraints:
        - topologyKey: kubernetes.io/hostname
          maxSkew: 1
          whenUnsatisfiable: DoNotSchedule
          nodeTaintsPolicy: Honor
          matchLabelKeys:
            - pod-template-hash
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: mafest-api
      # CP·GPU 노드에는 두지 않는다. 위 분산은 이 두 워커 안에서만 계산된다.
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values:
                      - k8s-worker1
                      - k8s-worker2
      containers:
        - name: api
          # 승인된 앱 릴리스(mafest c345fbf2…)의 digest. 최초 적재용 digest와 다르다. 릴리스마다 사람이 승인한 값으로
          # 바꾸고 validator의 승인 상수도 함께 갱신한다.
          image: ghcr.io/persona-runtime/mafest-app@sha256:6523b6dea77fd2bb54e669694ae623ee7db2bc5bd538ae53626745024c8c62e0
          imagePullPolicy: IfNotPresent
          # 이미지 CMD에 --timeout-graceful-shutdown이 없어 같은 실행 형태에 그 옵션만 더해 명시한다.
          # command는 쓰지 않는다(이미지에 ENTRYPOINT가 없어 args가 CMD를 대체한다).
          args:
            - uvicorn
            - mafest.serving.api.app:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --workers
            - "1"
            - --timeout-keep-alive
            - "65"
            - --timeout-graceful-shutdown
            - "100"
          # 엔드포인트 제거(로드밸런서 반영) 시간을 벌기 위해 SIGTERM 전에 10초 기다린다. exec sleep은 이미지의
          # coreutils에 의존한다(런북에서 Pod 안에서 확인). 실패해도 SIGTERM은 이어서 간다.
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "10"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            # 실제 vLLM으로 생성한다. 이미지에도 같은 값이 있지만 운영 의도를 선언에 명시한다.
            - name: LLM_USE_MOCK
              value: "0"
            # v1 운영은 벡터 검색을 쓰지 않는다(KURE 모델이 이미지에 없다).
            - name: MAFEST_ENABLE_VECTOR
              value: "0"
            # persona-inference vLLM Service. /v1 앞까지 적는다 — mafest llm/client.py가 /v1/chat/completions를 붙인다.
            - name: MAFEST_LLM_BASE_URL
              value: http://persona-vllm.persona-inference.svc.cluster.local:8000
            # vLLM --served-model-name과 같아야 한다. 다르면 vLLM이 404를 돌려준다.
            # vLLM이 --api-key 없이 뜨므로(kustomize/base/persona-vllm/deployment.yaml) MAFEST_LLM_API_KEY는
            # 연결하지 않는다. 접근 통제는 persona-inference의 allow-vllm-gateway(mafest-api Pod만)가 한다.
            - name: MAFEST_LLM_MODEL
              value: Qwen/Qwen3-4B-Instruct-2507
            # 생성 상한 60초, 전체 요청 상한 90초(생성 포함). 스트림은 10초마다 ping을 보내 유휴 끊김을 막는다.
            - name: MAFEST_LLM_TIMEOUT_S
              value: "60"
            - name: MAFEST_REQUEST_TIMEOUT_S
              value: "90"
            - name: MAFEST_STREAM_PING_S
              value: "10"
            # readiness는 프로세스 상태만 본다. DB·vLLM 상태는 15초 주기(시도당 1초)로 따로 점검해 지표로만 남긴다.
            - name: MAFEST_READINESS_MODE
              value: process
            - name: MAFEST_DEPENDENCY_CHECK_INTERVAL_S
              value: "15"
            - name: MAFEST_DEPENDENCY_CHECK_TIMEOUT_S
              value: "1"
            # 검색 병렬 작업자 수(DB 풀 4·AGE 풀 2 안에서 대기하며 동작한다).
            - name: MAFEST_SEARCH_WORKERS
              value: "8"
            # Pod당 SQL 풀 4·AGE 풀 2(Settings 기본값). 연결 합산의 근거라 선언에 고정한다.
            - name: MAFEST_DB_POOL_MAX
              value: "4"
            - name: MAFEST_GRAPH_POOL_MAX
              value: "2"
            # 멀티턴 확인 질문 기능의 초기 활성화 값. 값은 정확히 "1"/"0"만 켬/끔으로 읽힌다(true 등은 꺼짐).
            # 첫 배포에서는 요약·후속 제안을 끄고 해석 호출의 자동 재시도도 0으로 둔다(요청당 모델 호출 수를 줄인다).
            # 끄려면 MAFEST_LLM_INTENT만 "0"으로 되돌린다. 세션 테이블은 그대로 둔다(롤백 절차: deploy/mafest-multiturn/README.md).
            - name: MAFEST_LLM_INTENT
              value: "1"
            - name: MAFEST_LLM_STRUCTURED
              value: "1"
            - name: MAFEST_LLM_RETRIES
              value: "0"
            - name: MAFEST_LLM_SUMMARY
              value: "0"
            - name: MAFEST_LLM_SUGGEST
              value: "0"
            # 세션 저장소 풀은 Pod당 최대 2 연결(첫 사용 때 연결한다). 롤링 중 연결 예산은 검사기가 계산한다.
            - name: MAFEST_SESSION_POOL_MAX
              value: "2"
            # 승인된 운영 데이터 기준일(채권 등 기준일 열이 없는 상품군에 쓴다). 임의로 바꾸지 않는다.
            # 재적재로 기준일이 바뀌면 사람이 승인한 값으로 갱신하고 API를 재시작한다(기준일은 기동 때 읽는다).
            - name: MAFEST_DATA_BASE_DATE
              value: "2026-08-21"
            # runtime 계정 DSN(mafest_runtime). mafest-data의 mafest-db-runtime은 다른 namespace라 직접 참조할 수
            # 없어, 사람이 값 출력 없이 mafest-app에 복제한다(런북). owner용 mafest-migrator는 연결하지 않는다.
            - name: PGURL
              valueFrom:
                secretKeyRef:
                  name: mafest-api-db
                  key: PGURL
            # 세션 저장소 접속(mafest_session 역할)과 서버 키. 두 Pod가 같은 Secret을 참조하므로 같은 키를 쓴다.
            # Secret mafest-api-session은 사람이 값 출력 없이 만든다(Git에 값 없음). 서버 키가 Pod마다 다르면
            # 다른 Pod에서 확인 세션 secret을 다시 만들 수 없다. 로컬 시험 자격을 복사하지 않는다.
            - name: PGURL_SESSION
              valueFrom:
                secretKeyRef:
                  name: mafest-api-session
                  key: PGURL_SESSION
            - name: MAFEST_SESSION_KEY
              valueFrom:
                secretKeyRef:
                  name: mafest-api-session
                  key: MAFEST_SESSION_KEY
          resources:
            # 출발 후보(문서 35): request 1Gi·limit 1536Mi. 근거는 M1 로컬 실측(76문항 순차 580MiB, 8동시
            # 593MiB)과 A7 검증 Pod peak 580.1MiB다. 운영 API·L2 입력이 같은 부하라고 단정하지 않는다 — 최신 노드
            # 사용량·예약량을 사람이 확인한 뒤 승인한다. A7의 임시 2Gi는 운영값이 아니다.
            # CPU limit은 두지 않는다(근거 없는 상한은 생성 지연을 키운다). CPU request는 미확정 후보다.
            requests:
              cpu: 100m
              memory: 1Gi
            limits:
              memory: 1536Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          # startup은 bootstrap(조립·기준일 읽기) 완료를 /healthz 응답으로 본다. liveness도 /healthz다 —
          # DB·vLLM 장애로 재시작시키면 복구되지 않는 재시작 루프가 된다.
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          # readiness는 /readyz이며 MAFEST_READINESS_MODE=process라 DB·AGE·vLLM 가용성을 넣지 않는다(공개 API
          # 결정 R9-4). 종료 신호를 받으면 앱이 503으로 바꿔 Service 대상에서 빠진다.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 1
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        # read-only rootfs에서 필요한 유일한 쓰기 경로다(이미지 HOME=/tmp). 크기를 묶어 노드 디스크를 지킨다.
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
