# 모델 cache seed Job — Qwen/Qwen3-4B-Instruct-2507 @ cdbee75를 /models에 받는다.
#
# 완료 판정은 명령 종료 코드가 아니다. seed_model.py가 upstream metadata(files_metadata)와 대조해
# 통과한 경우에만 최종 경로로 옮기고 완료 marker를 쓴다.
# - commit이 고정 revision과 같다.
# - 파일 목록이 정확히 같다.
# - 크기, LFS sha256, git blob sha1이 같다.
# - 필수 파일과 weight index shard가 있다.
#
# 다운로드 호스트는 관측한 세 개만 network-policy-fqdn.yaml로 연다. 호스트 이름이 바뀌면 이 Job이 막히며,
# 다시 관측하는 절차는 bootstrap/persona-model-seed/README.md에 있다. 추측한 allowlist를 만들지 않는다.
#
# Job은 불변이다. 다시 실행하려면 Job을 지우고 적용한다. 이미 완료된 cache는 다시 받지 않고
# 재검증만 한다.
apiVersion: batch/v1
kind: Job
metadata:
  name: persona-vllm-model-seed
  labels:
    app.kubernetes.io/name: persona-vllm-model-seed
    app.kubernetes.io/component: model-cache-seed
    app.kubernetes.io/part-of: persona-platform
spec:
  # 실패를 재시도로 덮지 않는다. 다운로드가 왜 실패했는지(네트워크·정책·용량·revision·무결성)
  # 구분하지 못한 채 반복하면 원인을 잃는다.
  backoffLimit: 0
  # 약 7.5 GiB 다운로드와 전체 해시 계산에 충분한 상한. 매달린 Job이 PVC를 계속 쥐지 않게 한다.
  activeDeadlineSeconds: 7200
  # 완료·실패한 Job과 로그를 자동으로 지우지 않는다(ttlSecondsAfterFinished 없음).
  template:
    metadata:
      labels:
        # vLLM과 **다른** name label을 쓴다. 같은 라벨이면 vLLM용 ingress·metrics 정책이
        # 이 Pod에도 걸리고, 이 Pod용 외부 egress가 vLLM에도 열린다.
        app.kubernetes.io/name: persona-vllm-model-seed
        app.kubernetes.io/component: model-cache-seed
        app.kubernetes.io/part-of: persona-platform
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      # GPU 노드에만 스케줄한다(PVC가 그 노드에 고정되도록). GPU를 요청하지 않고 RuntimeClass도
      # 쓰지 않는다 — 파일만 받는 Job이 vLLM이 쓸 유일한 GPU를 점유하면 seed와 서빙이 서로 막는다.
      nodeSelector:
        personaruntime.xyz/node-pool: gpu
      tolerations:
        - key: personaruntime.xyz/dedicated
          operator: Equal
          value: gpu-serving
          effect: NoSchedule
      # image 기본 사용자는 root다. 10001로 실행해도 동작함을 실측했다(2026-09-27).
      # fsGroup 10001: 그 non-root·read-only smoke가 통과한 조건과 같게 둔다. seed는 UID/GID 10001로
      # /tmp/hf-home에 Hugging Face cache를 만들므로, 볼륨의 group 소유를 실행 group과 맞춘다.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          # vLLM과 같은 image(huggingface_hub 1.30.0 포함)를 쓴다. 별도 seed image를 두면 다운로드
          # 도구 버전이 서빙 image와 갈라진다. tag가 아니라 linux/amd64 digest로 고정한다.
          image: vllm/vllm-openai@sha256:51b1042786c1bb7ab640fd05e4a2b19ae41662959387cc07e1c3106ae2a851b8
          imagePullPolicy: IfNotPresent
          command: ["python3", "/opt/persona-seed/seed_model.py"]
          env:
            # 모델과 revision을 고정한다. revision은 40자리 commit이어야 한다(스크립트도 검사).
            - name: MODEL_ID
              value: Qwen/Qwen3-4B-Instruct-2507
            - name: MODEL_REVISION
              value: cdbee75f17c01a7cc42f958dc650907174af0554
            - name: TARGET_DIR
              value: /models
            # hub 설정·임시 파일은 /tmp(emptyDir)에 둔다. read-only rootfs에서 쓰기 가능한 곳은
            # /tmp와 /models뿐이다.
            - name: HOME
              value: /tmp
            - name: HF_HOME
              value: /tmp/hf-home
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          # 토큰이 필요한 모델이 아니다(gated=false). 필요해지면 Secret으로 주고 여기 값을 적지 않는다.
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: model-cache
              mountPath: /models
            - name: tmp
              mountPath: /tmp
            - name: seed-script
              mountPath: /opt/persona-seed
              readOnly: true
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: persona-vllm-model-cache
        # 다운로드 중 파일은 staging(PVC)에 쓰이므로 /tmp에는 hub 설정·작은 임시 파일만 남는다.
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
        - name: seed-script
          configMap:
            name: persona-vllm-model-seed-script
            defaultMode: 0444
# ── vLLM 쪽이 지켜야 할 것 (vLLM Deployment는 아직 선언하지 않는다) ─────────────
#
# - 같은 PVC를 read-only로 mount하고 /models/Qwen/Qwen3-4B-Instruct-2507/<revision>을 읽는다.
# - 쓰기가 필요한 경로(/tmp, runtime cache)는 emptyDir로 따로 준다.
# - seed Job이 Complete이고 완료 marker(.persona-seed-complete.json)가 있는 것을 사람이 확인한
#   뒤에 vLLM을 시작한다. initContainer로 묶지 않는 이유는 다운로드 실패와 서빙 실패를 섞지
#   않기 위해서다.
# - vLLM Pod에는 모델 다운로드 egress가 없다(allow-vllm-dns가 유일한 egress다).
