apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# persona-inference 네임스페이스의 NetworkPolicy만 관리한다. persona-app-netpol과 같은
# 분리 규약이다 — 워크로드 배포와 네트워크 정책 변경은 위험도·롤백 절차가 달라 한 Sync에
# 묶지 않는다. namespace는 kustomize/overlays/prod/persona-model-cache가 소유한다.
#
# **이 overlay를 가리키는 Argo Application이 없다.** 사람이 control-plane에서
# `kubectl apply -k`로 적용한다. kubectl은 sync-wave를 읽지 않으므로 base의
# `persona.runtime/apply-phase` label로 allow → deny 순서를 나눠 적용한다.
namespace: persona-inference
resources:
  - ../../../base/networkpolicy/persona-inference
