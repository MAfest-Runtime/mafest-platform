apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# vLLM Deployment·Service·PodMonitor. persona-inference Namespace와 모델 cache PVC가 이미 있다는
# 전제다(kustomize/overlays/prod/persona-model-cache).
#
# **이 overlay를 가리키는 Argo Application이 없다.** 첫 기동은 사람이 control-plane에서 적용하고
# 확인한다. ops-lab의 repos/persona-platform/tools/validate-vllm-manifests.sh가 Argo 선언의 이 경로 참조를 막는다.
namespace: persona-inference
resources:
  - ../../../base/persona-vllm
