apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# FP8-A 재현: BF16 체크포인트를 그대로 두고 vLLM이 띄울 때 텐서 단위로 FP8로 바꾼다(`--quantization fp8`).
# 2026-10-21에 수동으로 한 실험을 기록으로 남긴 것이다.
#
# **운영 기본값이 아니다.** 실험 결과(decode 1.5배, 해석 JSON 변동 28/74, 답변 6→4)는 이 방식이 품질을
# 해쳤음을 보였다. prod overlay는 바꾸지 않는다.
#
# 적용:      kubectl --context <context> diff -k kustomize/overlays/exp/persona-vllm-fp8-dynamic
#            kubectl --context <context> apply -k kustomize/overlays/exp/persona-vllm-fp8-dynamic
# 되돌리기:  kubectl --context <context> apply -k kustomize/overlays/prod/persona-vllm
#
# **이 overlay를 가리키는 Argo Application이 없다.**
namespace: persona-inference
resources:
  - ../../prod/persona-vllm
patches:
  - target:
      kind: Deployment
      name: persona-vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --quantization
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: fp8
