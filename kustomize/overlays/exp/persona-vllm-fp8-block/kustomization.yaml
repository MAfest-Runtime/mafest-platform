apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# FP8-B: Qwen이 배포한 공식 FP8 체크포인트(Qwen/Qwen3-4B-Instruct-2507-FP8 @ 8591804, 128×128 블록 단위
# 배율)로 서빙한다. 체크포인트는 모델 seed overlay
# (kustomize/overlays/prod/persona-model-seed-qwen3-4b-fp8)로 먼저 받아 두어야 한다.
#
# **운영 기본값이 아니다.** 실험용이며 prod overlay는 바꾸지 않는다.
#
# 바꾸는 것(세 곳이 같은 모델·revision을 가리켜야 한다)
# 1. vllm 명령의 모델 경로
# 2. init container가 보는 디렉터리(dir=)
# 3. init container가 마커에서 확인하는 revision
# 그리고 init container의 필수 파일 목록: 이 체크포인트는 weight index 없이 단일 model.safetensors라서
# model.safetensors.index.json 대신 model.safetensors를 확인한다.
#
# 바꾸지 않는 것
# - `--quantization`은 넣지 않는다. 체크포인트 config.json의 quantization_config(fp8, 블록 128×128)에서
#   vLLM이 자동으로 고른다.
# - `--served-model-name Qwen/Qwen3-4B-Instruct-2507`은 그대로다(앱이 같은 이름으로 부른다).
#
# 적용:      kubectl --context <context> diff -k kustomize/overlays/exp/persona-vllm-fp8-block
#            kubectl --context <context> apply -k kustomize/overlays/exp/persona-vllm-fp8-block
# 되돌리기:  kubectl --context <context> apply -k kustomize/overlays/prod/persona-vllm
#
# Ada(sm_89)에서 어떤 FP8 커널이 선택되는지는 기동 로그의 `Selected ... for ...` 줄로 확인한다.
#
# **이 overlay를 가리키는 Argo Application이 없다.**
namespace: persona-inference
resources:
  - ../../prod/persona-vllm
patches:
  - target:
      kind: Deployment
      name: persona-vllm
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/command/2
        value: /models/Qwen/Qwen3-4B-Instruct-2507-FP8/8591804019c8b22094c3b5b4454e0edc05dffc98
      - op: replace
        path: /spec/template/spec/initContainers/0/command/2
        value: |
          set -eu
          dir=/models/Qwen/Qwen3-4B-Instruct-2507-FP8/8591804019c8b22094c3b5b4454e0edc05dffc98
          for name in .persona-seed-complete.json .persona-seed-manifest.json model.safetensors; do
            if [ ! -s "$dir/$name" ]; then
              echo "model cache not ready: missing $name" >&2
              exit 1
            fi
          done
          if ! grep -q '"revision": "8591804019c8b22094c3b5b4454e0edc05dffc98"' "$dir/.persona-seed-complete.json"; then
            echo "model cache marker revision mismatch" >&2
            exit 1
          fi
          echo "model cache verified"
