apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# KV cache FP8 실험: KV cache만 FP8로 저장한다(`--kv-cache-dtype fp8`).
# KV cache 토큰 수(동시성 여유)가 늘어나는지와 품질 변화를 본다.
#
# 측정한 조합은 BF16 가중치 + FLASHINFER였다. prod가 FP8-B + CPU n-gram으로 바뀐 뒤에는 이 overlay가
# 그 위에 인자만 덧붙이므로, 이 조합으로는 측정한 적이 없다. 쓰기 전에 다시 잰다.
#
# **운영 기본값이 아니다.** prod overlay는 바꾸지 않는다.
#
# 적용:      kubectl --context <context> diff -k kustomize/overlays/exp/persona-vllm-kv-fp8
#            kubectl --context <context> apply -k kustomize/overlays/exp/persona-vllm-kv-fp8
# 되돌리기:  kubectl --context <context> apply -k kustomize/overlays/prod/persona-vllm
#
# **이 overlay를 가리키는 Argo Application이 없다.**
namespace: persona-inference
resources:
  - ../../prod/persona-vllm
patches:
  - target:
      kind: Deployment
      name: persona-vllm
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: --kv-cache-dtype
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: fp8
