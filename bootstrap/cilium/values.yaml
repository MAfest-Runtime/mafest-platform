# Cilium — persona-runtime 홈 클러스터
# 설치: helm install cilium cilium/cilium --version 1.20.1 -n kube-system -f values.yaml

cluster:
  name: persona-runtime

# --- kube-proxy 유지 ---
# 변수를 하나씩만 바꾼다. CNI와 kube-proxy를 동시에 바꾸면 K8S-01의 원인 분리가 불가능해진다.
# Cilium의 Gateway API 기능이 kubeProxyReplacement를 요구하므로, 이 값이 false인 한
# Gateway API는 Traefik이 단독으로 소유한다.
kubeProxyReplacement: false

# --- 라우팅과 MTU ---
routingMode: tunnel
tunnelProtocol: vxlan

# MTU (실측으로 확정)
#   tailscale0 = 1280  ·  LAN = 1500  ·  VXLAN 오버헤드 = 50 bytes
#
#   이 값은 **underlay 기준값**이다. Cilium은 인터페이스에는 이 값을 그대로 쓰고,
#   파드 netns의 라우트에는 여기서 터널 오버헤드를 뺀 값을 넣는다.
#   실효 경로 MTU는 라우트 값이므로, 검증은 반드시 `ip route get`으로 한다.
#
#     MTU: 1280 → eth0 1280 / route 1230 → 캡슐화 후 1280 → tailscale0에 정확히 맞음
#
#   자동 감지에 맡기면 LAN 기준 1500으로 잡혀 캡슐화 후 1500이 되고,
#   AWS 워커가 조인하는 순간 tailscale0(1280)을 넘는 패킷이 조용히 사라진다.
#   K8S-01은 이 정상 기준선에서 변수 하나만 바꾸는 방식으로 설계한다.
MTU: 1280

# MTU 등 ConfigMap에만 반영되는 값은 helm upgrade로 파드가 재시작되지 않는다.
# 이 옵션이 pod template에 체크섬을 넣어 자동 재시작시킨다.
# 다만 helm은 알 수 없는 값을 조용히 무시하므로, 이것에만 의존하지 말고
# 설정 변경 후에는 항상 실제 인터페이스 MTU를 확인한다 (README 참고).
rollOutCiliumPods: true

# --- IPAM ---
# kubeadm이 노드에 할당한 spec.podCIDR을 그대로 사용한다.
# 진실의 출처를 하나로 두어 디버깅 시 kubectl 값과 실제가 어긋나지 않게 한다.
ipam:
  mode: kubernetes

# --- Gateway API / Ingress: Traefik이 소유한다 ---
gatewayAPI:
  enabled: false
ingressController:
  enabled: false

# --- Hubble: K8S-01의 핵심 도구 ---
# 드롭 이유 라벨과 흐름 관측이 없으면 MTU 원인 확정이 추측이 된다.
hubble:
  enabled: true
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    # 라벨을 source/destination namespace로 제한한다. 옵션을 주지 않으면 IP·workload 같은
    # 값이 라벨에 들어가 Pod가 늘 때마다 시계열이 함께 늘어난다. dns에는 `query` 옵션을
    # 주지 않는다(질의 도메인별 시계열이 생긴다). 이 목록의 옵션 이름이 틀려도 helm은
    # 오류를 내지 않으므로 helm template로 hubble-metrics 줄을 확인한다.
    enabled:
      - dns:labelsContext=source_namespace,destination_namespace
      - drop:labelsContext=source_namespace,destination_namespace
      - tcp:labelsContext=source_namespace,destination_namespace
      - flow:labelsContext=source_namespace,destination_namespace
      - icmp:labelsContext=source_namespace,destination_namespace
    # kube-prometheus-stack은 `release: monitoring-stack` 라벨이 있는 ServiceMonitor만 고른다
    # (serviceMonitorSelectorNilUsesHelmValues 기본값). 라벨이 없으면 만들어져도 수집되지 않는다.
    serviceMonitor:
      enabled: true
      # chart 기본 10s는 hubble 시계열이 많을수록 샘플 수가 늘어난다. DNS 실패는 분 단위라 30s로 충분하다.
      interval: 30s
      labels:
        release: monitoring-stack

# --- 메트릭 노출 (cilium-agent :9962, hubble :9965, 둘 다 hostNetwork) ---
# monitoring-stack이 설치돼 있어 ServiceMonitor를 켠다. 수집 라벨 조건은 위 hubble 주석을 본다.
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 30s
    labels:
      release: monitoring-stack
    # 차트는 렌더 시점에 CRD가 있는지 클러스터에 묻는다. CRD는 monitoring-stack이 설치하므로
    # 그 확인을 건너뛴다(helm template처럼 클러스터 없는 렌더에서도 ServiceMonitor가 나온다).
    trustCRDsExist: true
operator:
  prometheus:
    enabled: true
  # 워커 2대 환경에서 replica 2는 과하다.
  replicas: 1
