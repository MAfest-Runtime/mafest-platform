# kubeadm 이 만든 kube-system/coredns ConfigMap 에 서버 블록 하나를 더한 것이다. Argo CD 가 관리하지 않으며
# 사람이 적용한다(README.md). 기존 `.:53` 블록은 2026-10-16 클러스터 출력(CoreDNS v1.14.2) 그대로다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns
  namespace: kube-system
data:
  Corefile: |
    .:53 {
        errors
        health {
           lameduck 5s
        }
        ready
        kubernetes cluster.local in-addr.arpa ip6.arpa {
           pods insecure
           fallthrough in-addr.arpa ip6.arpa
           ttl 30
        }
        prometheus :9153
        forward . /etc/resolv.conf {
           max_concurrent 1000
        }
        cache 30 {
           disable success cluster.local
           disable denial cluster.local
        }
        loop
        reload
        loadbalance
    }
    # 노드의 Tailscale 검색 도메인(tail94eeff.ts.net)이 kubelet 을 통해 Pod 의 resolv.conf 에 상속된다.
    # 그래서 바깥 이름을 조회할 때마다 <이름>.tail94eeff.ts.net 이 공용 DNS(1.1.1.1, 8.8.8.8)까지
    # 나갔다가 NXDOMAIN 으로 돌아온다. 이 클러스터는 노드 간 통신에 Tailnet IP 를 직접 쓰고
    # 공용 DNS 는 tailnet 이름을 풀지 못하므로, 이 도메인은 바깥으로 넘기지 않고 여기서 바로 NXDOMAIN 으로 답한다.
    # 위 `.:53` 블록은 바꾸지 않는다. 더 구체적인 이 영역이 먼저 선택된다.
    tail94eeff.ts.net:53 {
        errors
        template ANY ANY {
            rcode NXDOMAIN
        }
    }
