# Traefik 41.4.0 (Traefik v3.7.12) — Gateway API 컨트롤러
# 스키마 검사 통과만으로 설정 반영을 보장하지 않는다. 렌더 결과와 실제 Deployment를 확인한다.

# 홈 서버에서 적용·확인한 목표 배치. 근거: ../../../tradeoff/07-service-replicas.md
# 기존 Helm 값에 hostname 고정이 있으면 빈 맵을 병합하는 것만으로 제거되지 않을 수 있다.
# README의 마이그레이션 기록을 확인한다.
nodeSelector: {}

deployment:
  replicas: 2

# 두 Traefik Pod는 서로 다른 홈 워커에 둔다(필수 규칙).
# - 2026-09-08에는 "권장(preferred)"으로 정했다. 워커가 두 대라 강제하면 노드 하나가 빠질 때
#   Pod가 Pending이 되고 롤링 업데이트 여유가 줄기 때문이었다.
# - 2026-09-17에 externalTrafficPolicy: Local을 넣으면서 조건이 바뀌었다. MetalLB는 Ready
#   엔드포인트가 있는 노드에서만 VIP를 광고하므로, Pod가 한 노드에 몰리면 VIP도 그 노드에
#   묶인다.
# - 2026-10-18 조회에서 Traefik 2개가 모두 k8s-worker2에 있었다. preferred 규칙은 배치된 뒤
#   다시 나누지 않으므로 한번 몰리면 그대로 남는다. 언제부터 몰렸는지는 Pod 생성 기록이 없어
#   확정하지 못한다(Deployment Available 전환 시각 2026-10-01 16:06은 정황일 뿐이다).
# - 그래서 필수 규칙으로 바꾼다. 감수하는 비용: 노드 하나가 빠진 동안 Traefik은 1개만
#   남고(빠진 노드의 Pod는 Pending), 업데이트 중 VIP 광고 노드가 바뀌면 수 초 끊길 수 있다.
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k8s-worker1
                - k8s-worker2
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - topologyKey: kubernetes.io/hostname
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
            app.kubernetes.io/instance: traefik-traefik

# 필수 분산 + 노드 두 대에서는 surge Pod가 갈 곳이 없어 기본값(maxSurge 1)이면 업데이트가
# 멈춘다. 한 번에 한 Pod를 내리고 새로 올리는 방식으로 바꾼다.
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 0
    maxUnavailable: 1

# PDB는 drain 같은 eviction만 제한한다. 롤링 업데이트나 노드 장애 때 최소 1개 생존을
# 보장하지는 않는다(업데이트는 위 updateStrategy와 readinessProbe가 맡는다).
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# 2026-09-17 공개 진입 결정: MetalLB가 있는 LoadBalancer만 허용, NodePort 할당은 off.
# 이전의 "public inbound 0 원칙, NodePort/LoadBalancer 금지"는 여기서 뒤집힌다 — 공유기가
# 443 하나만 192.168.50.240으로 포워딩하고, 나머지 인바운드는 계속 0이다(tradeoff 05 참고).
# Tailnet 노출은 그대로 tailscale serve가 노드에서 ClusterIP/LoadBalancer로 전달하는 방식이다.
#
# 주의: 41.x에서 타입은 service.spec.type 이다. service.type 은 존재하지 않는 키인데,
# service 섹션에 additionalProperties:false 가 없어 스키마를 통과한 뒤 무시된다.
#
# MetalLB가 없는 상태에서 LoadBalancer로 두면 EXTERNAL-IP는 pending이지만 NodePort가 함께
# 할당되어 모든 노드에 포트가 열린다. allocateLoadBalancerNodePorts: false로 그 자동 NodePort
# 할당을 막는다 — MetalLB VIP 하나만 열리고 이전 ingress-nginx NodePort 상태로 돌아가지 않는다.
service:
  spec:
    type: LoadBalancer
    allocateLoadBalancerNodePorts: false
    # L2는 어차피 노드 한 대가 받는다. Local이어야 클라이언트 IP가 보존돼 Gate 4의 rate limit이
    # 의미 있다. MetalLB는 Ready 엔드포인트가 있는 노드에서만 announce하므로 failover가
    # Pod를 따라간다(externalTrafficPolicy: Cluster였다면 클라이언트 IP가 SNAT으로 사라진다).
    #
    # 주의: Local은 allocateLoadBalancerNodePorts: false와 별개로 kube-proxy가 모든 노드에
    # healthCheckNodePort를 하나 연다(spec.healthCheckNodePort, 3xxxx대 — MetalLB가 "이 노드에
    # Ready 엔드포인트가 있는가"를 확인하는 용도). LAN 안에서만 닿고 Gate 2가 LAN 외부 접근을
    # 막으므로 위험은 아니지만, "자동 NodePort 0"이라고만 쓰면 이 포트를 빠뜨리게 된다.
    externalTrafficPolicy: Local
  annotations:
    # loadBalancerIP 필드는 deprecated라 쓰지 않는다.
    metallb.io/loadBalancerIPs: "192.168.50.240"
    metallb.io/address-pool: traefik-pool

ports:
  websecure:
    port: 8443
    exposedPort: 443
  # web(80)은 유지한다 — VIP의 80은 LAN 전용이다. 공유기는 443만 포워딩한다.

providers:
  kubernetesGateway:
    enabled: true
  # Gate 4: Gateway API HTTPRoute의 ExtensionRef로 traefik.io/Middleware(oauth-forward·
  # rate-limit 등)를 쓰려면 static config의 Kubernetes CRD 프로바이더가 켜져 있어야
  # 한다 — Traefik이 이 프로바이더 없이는 Middleware CRD 자체를 안 본다. 공식 문서:
  # https://doc.traefik.io/traefik/reference/routing-configuration/kubernetes/gateway-api/
  # ("To use Traefik middlewares as ExtensionRef filters, the Kubernetes CRD provider
  # must be enabled in the static configuration."). kubernetesIngress는 Gateway API만
  # 쓰므로 계속 꺼둔다 — 두 프로바이더는 독립 토글이라 CRD를 켠다고 Ingress까지
  # 켜지지 않는다.
  kubernetesCRD:
    enabled: true
  kubernetesIngress:
    enabled: false

# 기본 Gateway 리소스는 차트가 만들지 않는다 — 우리가 선언하고 버전관리한다.
gateway:
  enabled: false

# GatewayClass는 별도 키다. 이것이 있어야 Traefik이 Gateway API 컨트롤러로 동작한다.
gatewayClass:
  enabled: true

# Gateway API만 사용하므로 IngressClass는 만들지 않는다.
ingressClass:
  enabled: false

# 커스텀 우선순위 튜닝은 측정 뒤로 미룬다. 실제 Helm 적용은 별도 승인 후 진행한다.
priorityClassName: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

# log / accessLog 는 하위 키 구조를 확인한 뒤 추가한다:
#   helm show values traefik/traefik --version 41.4.0 | sed -n '/^log:/,/^metrics:/p'
