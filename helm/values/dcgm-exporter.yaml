# GPU-00 관측 기준선. GPU Operator는 설치하지 않고, host에 준비된 NVIDIA containerd
# handler를 RuntimeClass/nvidia로 선택한다. image tag는 chart 4.8.4가 검증한 조합으로
# 고정한다. digest를 확인하기 전에는 비어 둔다 — 확인하지 않은 digest를 적지 않는다.
image:
  repository: nvcr.io/nvidia/k8s/dcgm-exporter
  tag: 4.6.1-4.8.4-distroless
  pullPolicy: IfNotPresent

# 일반 시스템 DaemonSet보다 높은 우선순위를 주지 않는다. exporter가 죽어도 inference
# 요청 자체는 계속 처리되어야 하며, 관측 실패는 Target Down으로 드러나야 한다.
priorityClassName: ""
runtimeClassName: nvidia
hostPID: false
hostNetwork: false

# chart 기본값의 control-plane toleration을 대체한다. GPU 전용 taint를 허용한 Pod만
# persona-gpu-01에 올라가므로 홈 워커·control-plane에서는 exporter가 실행되지 않는다.
nodeSelector:
  personaruntime.xyz/node-pool: gpu
tolerations:
  - key: personaruntime.xyz/dedicated
    operator: Equal
    value: gpu-serving
    effect: NoSchedule

# 기본 counters는 profiling metric을 포함할 수 있어 DCGM이 SYS_ADMIN을 요구한다. 이
# capability는 exporter 컨테이너에만 남기고, GPU 전용 노드·NoSchedule taint로 범위를
# 한정한다. collectors를 비-profiling으로 좁혀 실측 검증하기 전에는 임의로 제거하지 않는다.
securityContext:
  runAsNonRoot: false
  runAsUser: 0
  capabilities:
    add:
      - SYS_ADMIN
    drop:
      - ALL
  allowPrivilegeEscalation: false

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 200m
    memory: 512Mi

# Prometheus Operator가 release label로 ServiceMonitor를 선택한다. Pod label·UID
# 수집은 시계열 cardinality를 불필요하게 늘리므로 이 기준선에서는 끈다.
kubernetes:
  enablePodLabels: false
  enablePodUID: false
serviceAccount:
  automountServiceAccountToken: false
service:
  enable: true
  type: ClusterIP
  internalTrafficPolicy: Cluster
  port: 9400
  webReadTimeout: 10s
  webWriteTimeout: 30s

# B0 GPU 계측: exporter가 5초(5000ms)마다 DCGM 값을 읽는다. ServiceMonitor interval과 같다.
# 명령줄 인자(-c 5000)로 주면 숫자가 따옴표 없이 렌더돼 Kubernetes가 거부하므로 환경변수로 준다.
extraEnv:
  - name: DCGM_EXPORTER_INTERVAL
    value: "5000"

# 수집 지표 목록. 차트의 customMetrics는 **추가분이 아니라 전체 목록**이다(빠진 줄은 사라진다).
# 그래서 차트 4.8.4의 기본 목록을 그대로 두고 B0에 필요한 세 줄만 더했다([B0 추가] 표시).
# 지표 뜻:
#   GR_ENGINE_ACTIVE  커널이 하나라도 돌고 있던 시간 비율. nvidia-smi의 GPU 사용률과 비슷하다.
#   SM_ACTIVE         SM 58개 중 일한 SM의 평균 비율. 커널이 돌아도 SM 일부만 쓰면 낮다.
#   SM_OCCUPANCY      SM당 동시에 올라간 warp 수 ÷ 최대 48. 메모리 지연을 숨길 여력이다.
#   PIPE_TENSOR_ACTIVE 텐서코어가 일한 비율. 행렬곱이 연산에 묶이면 높다.
#   DRAM_ACTIVE       메모리 버스가 데이터를 나른 비율. 가중치와 KV 읽기에 묶이면 높다.
#   CLOCKS_EVENT_REASONS 전력 한도(72W)·온도 등으로 클럭이 내려갔는지.
# L4에서는 profiling 지표 일부를 동시에 못 모을 수 있다. 적용 뒤 빠지면 exporter 로그의 경고를 본다.
customMetrics: |
  # Format
  # If line starts with a '#' it is considered a comment
  # DCGM FIELD, Prometheus metric type, help message

  # Clocks
  DCGM_FI_DEV_SM_CLOCK,  gauge, SM clock frequency (in MHz).
  DCGM_FI_DEV_MEM_CLOCK, gauge, Memory clock frequency (in MHz).

  # Temperature
  DCGM_FI_DEV_MEMORY_TEMP, gauge, Memory temperature (in C).
  DCGM_FI_DEV_GPU_TEMP,    gauge, GPU temperature (in C).

  # Power
  DCGM_FI_DEV_POWER_USAGE,              gauge, Power draw (in W).
  DCGM_FI_DEV_TOTAL_ENERGY_CONSUMPTION, counter, Total energy consumption since the driver was last reloaded (in mJ).

  # PCIE
  # DCGM_FI_PROF_PCIE_TX_BYTES,  counter, Total number of bytes transmitted through PCIe TX via NVML.
  # DCGM_FI_PROF_PCIE_RX_BYTES,  counter, Total number of bytes received through PCIe RX via NVML.
  DCGM_FI_DEV_PCIE_REPLAY_COUNTER, counter, Total number of PCIe retries.

  # Utilization (the sample period varies depending on the product)
  DCGM_FI_DEV_GPU_UTIL,      gauge, GPU utilization (in %).
  DCGM_FI_DEV_MEM_COPY_UTIL, gauge, Memory utilization (in %).
  DCGM_FI_DEV_ENC_UTIL,      gauge, Encoder utilization (in %).
  DCGM_FI_DEV_DEC_UTIL ,     gauge, Decoder utilization (in %).

  # Errors and violations
  DCGM_FI_DEV_XID_ERRORS,            gauge,   Value of the last XID error encountered.
  # [B0 추가] 클럭 제한 사유 비트맵. 전력 한도(L4 72W)·온도 등으로 클럭이 내려갔는지 본다.
  # DCGM 4.x(3.3 이상)의 이름이다. 이전 이름 DCGM_FI_DEV_CLOCK_THROTTLE_REASONS는 폐기된 별칭이다.
  DCGM_FI_DEV_CLOCKS_EVENT_REASONS, gauge, Bitmap of reasons the GPU clocks were limited.
  # DCGM_FI_DEV_POWER_VIOLATION,       counter, Throttling duration due to power constraints (in ns).
  # DCGM_FI_DEV_THERMAL_VIOLATION,     counter, Throttling duration due to thermal constraints (in ns).
  # DCGM_FI_DEV_SYNC_BOOST_VIOLATION,  counter, Throttling duration due to sync-boost constraints (in ns).
  # DCGM_FI_DEV_BOARD_LIMIT_VIOLATION, counter, Throttling duration due to board limit constraints (in ns).
  # DCGM_FI_DEV_LOW_UTIL_VIOLATION,    counter, Throttling duration due to low utilization (in ns).
  # DCGM_FI_DEV_RELIABILITY_VIOLATION, counter, Throttling duration due to reliability constraints (in ns).

  # DCGM Exporter fields
  # DCGM_EXP_CLOCK_EVENTS_COUNT,       gauge,   Clock events observed during the configured time window.
  # DCGM_EXP_CLOCK_EVENTS_TOTAL,       counter, Total clock events observed since exporter start (edge-counted).
  # DCGM_EXP_XID_ERRORS_COUNT,         gauge,   XID errors observed during the configured time window.
  # DCGM_EXP_XID_ERRORS_TOTAL,         counter, Total XID errors observed since exporter start.
  # DCGM_EXP_GPU_HEALTH_STATUS,        gauge,   Current DCGM-reported GPU health status.
  # DCGM_EXP_P2P_STATUS,               gauge,   Current NVLink P2P status per peer link.

  # Fabric health
  # DCGM_FI_DEV_FABRIC_HEALTH_SUMMARY, gauge, Overall health of the GPU fabric.
  # DCGM_FI_DEV_FABRIC_HEALTH_MASK,    gauge, GPU fabric health status mask.

  # Memory usage
  DCGM_FI_DEV_FB_FREE, gauge, Framebuffer memory free (in MiB).
  DCGM_FI_DEV_FB_USED, gauge, Framebuffer memory used (in MiB).

  # ECC
  # DCGM_FI_DEV_ECC_SBE_VOL_TOTAL, counter, Total number of single-bit volatile ECC errors.
  # DCGM_FI_DEV_ECC_DBE_VOL_TOTAL, counter, Total number of double-bit volatile ECC errors.
  # DCGM_FI_DEV_ECC_SBE_AGG_TOTAL, counter, Total number of single-bit persistent ECC errors.
  # DCGM_FI_DEV_ECC_DBE_AGG_TOTAL, counter, Total number of double-bit persistent ECC errors.

  # Retired pages
  # DCGM_FI_DEV_RETIRED_SBE,     counter, Total number of retired pages due to single-bit errors.
  # DCGM_FI_DEV_RETIRED_DBE,     counter, Total number of retired pages due to double-bit errors.
  # DCGM_FI_DEV_RETIRED_PENDING, gauge, Whether pages are pending retirement (1 means pending and 0 means not pending).

  # NVLink
  # NVLink error counters for pre-Hopper GPUs
  # DCGM_FI_DEV_NVLINK_CRC_FLIT_ERROR_TOTAL, counter, Total number of NVLink flow-control CRC errors across all lanes.
  # DCGM_FI_DEV_NVLINK_CRC_DATA_ERROR_TOTAL, counter, Total number of NVLink data CRC errors across all lanes.
  # DCGM_FI_DEV_NVLINK_REPLAY_ERROR_TOTAL,   counter, Total number of NVLink replay errors across all lanes.
  # DCGM_FI_DEV_NVLINK_RECOVERY_ERROR_TOTAL, counter, Total number of NVLink recovery errors across all lanes.
  # NVLink data-link error counters for Hopper GPUs
  # DCGM_FI_DEV_NVLINK_CRC_ERROR_TOTAL, counter, Total number of NVLink data-link CRC errors.
  # DCGM_FI_DEV_NVLINK_RECOVERY_TOTAL,  counter, Total number of NVLink data-link recovery errors.
  # DCGM_FI_DEV_NVLINK_REPLAY_TOTAL,    counter, Total number of NVLink data-link replay errors.
  # NVLink recovery counters for Blackwell and newer GPUs
  # DCGM_FI_DEV_NVLINK_RECOVERY_SUCCESSFUL_TOTAL, counter, Total number of successful NVLink recovery events across all links.
  # DCGM_FI_DEV_NVLINK_RECOVERY_FAILED_TOTAL,     counter, Total number of failed NVLink recovery events across all links.
  # DCGM_FI_DEV_NVLINK_RECOVERY_EVENT_TOTAL,      counter, Total number of NVLink recovery events across all links.
  DCGM_FI_DEV_NVLINK_BANDWIDTH_TOTAL, gauge, Aggregate NVLink throughput across all lanes (in MB/s).
  # DCGM_FI_DEV_NVLINK_BANDWIDTH_L0, gauge, NVLink lane 0 throughput (in MB/s).

  # VGPU License status
  DCGM_FI_DEV_VGPU_LICENSE_STATUS, gauge, vGPU License status

  # Remapped rows
  DCGM_FI_DEV_UNCORRECTABLE_REMAPPED_ROWS, counter, Number of remapped rows for uncorrectable errors
  DCGM_FI_DEV_CORRECTABLE_REMAPPED_ROWS,   counter, Number of remapped rows for correctable errors
  DCGM_FI_DEV_ROW_REMAP_FAILURE,           gauge,   Whether remapping of rows has failed

  # DCP metrics
  DCGM_FI_PROF_GR_ENGINE_ACTIVE,   gauge, Ratio of time the graphics engine is active.
  # [B0 추가] SM 58개 중 일한 SM의 평균 비율. 커널이 돌아도 SM 일부만 쓰면 낮다.
  DCGM_FI_PROF_SM_ACTIVE,          gauge, The ratio of cycles an SM has at least 1 warp assigned.
  # [B0 추가] SM당 동시에 올라간 warp 수 ÷ 최대 48. 메모리 지연을 숨길 여력.
  DCGM_FI_PROF_SM_OCCUPANCY,       gauge, The ratio of number of warps resident on an SM.
  DCGM_FI_PROF_PIPE_TENSOR_ACTIVE, gauge, Ratio of cycles the tensor (HMMA) pipe is active.
  DCGM_FI_PROF_DRAM_ACTIVE,        gauge, Ratio of cycles the device memory interface is active sending or receiving data.
  # DCGM_FI_PROF_PIPE_FP64_ACTIVE,   gauge, Ratio of cycles the fp64 pipes are active.
  # DCGM_FI_PROF_PIPE_FP32_ACTIVE,   gauge, Ratio of cycles the fp32 pipes are active.
  # DCGM_FI_PROF_PIPE_FP16_ACTIVE,   gauge, Ratio of cycles the fp16 pipes are active.
  DCGM_FI_PROF_PCIE_TX_BYTES,      gauge, The rate of data transmitted over the PCIe bus - including both protocol headers and data payloads - in bytes per second.
  DCGM_FI_PROF_PCIE_RX_BYTES,      gauge, The rate of data received over the PCIe bus - including both protocol headers and data payloads - in bytes per second.
  # DCGM_FI_PROF_SM_CYCLES_ELAPSED_TOTAL, counter, Total elapsed SM cycles.
  # DCGM_FI_PROF_SM_CYCLES_ACTIVE_TOTAL,  counter, Total SM cycles with active warps.
  # DCGM_FI_PROF_MMA_CYCLES_ACTIVE_TOTAL, counter, Total MMA tensor cycles active.
  # DCGM_FI_PROF_DMMA_CYCLES_ACTIVE_TOTAL, counter, Total DMMA tensor cycles active.
  # DCGM_FI_PROF_HMMA_CYCLES_ACTIVE_TOTAL, counter, Total HMMA tensor cycles active.
  # DCGM_FI_PROF_IMMA_CYCLES_ACTIVE_TOTAL, counter, Total IMMA tensor cycles active.
  # DCGM_FI_PROF_DFMA_CYCLES_ACTIVE_TOTAL, counter, Total DFMA tensor cycles active.
  # DCGM_FI_PROF_PCIE_TX_BYTES_TOTAL,     counter, Total PCIe transmitted bytes.
  # DCGM_FI_PROF_PCIE_RX_BYTES_TOTAL,     counter, Total PCIe received bytes.
  # DCGM_FI_PROF_INT_CYCLES_ACTIVE_TOTAL, counter, Total integer pipe cycles active.
  # DCGM_FI_PROF_FP64_CYCLES_ACTIVE_TOTAL, counter, Total FP64 pipe cycles active.
  # DCGM_FI_PROF_FP32_CYCLES_ACTIVE_TOTAL, counter, Total FP32 pipe cycles active.
  # DCGM_FI_PROF_FP16_CYCLES_ACTIVE_TOTAL, counter, Total FP16 pipe cycles active.

serviceMonitor:
  enabled: true
  # B0 GPU 계측: 측정 구간이 1~2분이라 30초 간격이면 구간당 점이 2~4개뿐이다. 5초로 줄인다.
  # GPU가 1장이고 지표가 20여 개라 시계열 수는 그대로이고 샘플 수만 6배가 된다(무시할 수준).
  # scrapeTimeout은 interval보다 클 수 없어 함께 낮춘다. exporter 수집 간격(arguments -c)과 맞춘다.
  interval: 5s
  scrapeTimeout: 4s
  additionalLabels:
    release: monitoring-stack
