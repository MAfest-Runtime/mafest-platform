# kube-prometheus-stack 89.2.0 — H1 최소 모니터링
# 실제 배포는 Argo CD Application의 수동 Sync로만 수행한다.

crds:
  enabled: true

# H1은 외부 알림 전송을 다루지 않는다.
alertmanager:
  enabled: false

# 현재 홈 클러스터는 Linux 노드만 사용한다.
windowsMonitoring:
  enabled: false

# H1에서는 localhost 전용 메트릭을 외부에 열지 않는다.
# 이 옵션들은 차트의 수집 리소스만 제거하며 K8s 컴포넌트를 중지하지 않는다.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

# 미수집 대상에 의존하는 기본 알림·recording rule도 함께 보류한다.
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeProxy: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

grafana:
  enabled: true
  replicas: 1
  # 이 Secret은 Git에 두지 않고 수동 bootstrap으로 준비한다.
  # admin-user / admin-password 키를 고정해 Helm 난수 렌더를 막는다.
  admin:
    existingSecret: monitoring-grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: false
  # 이미지 태그를 chart 기본값에 맡기지 않고 여기서 고정한다. 값은 chart 89.2.0의
  # 기본값과 같다(grafana subchart 13.2.0, appVersion 13.2.1). 태그는 digest가 아니라
  # 같은 태그로 다른 이미지가 올 수 있다 — 완전한 불변 식별자는 아니다.
  image:
    tag: 13.2.1-distroless
  # 플러그인 런타임 설치(grafana.plugins → GF_PLUGINS_PREINSTALL_SYNC)는 선언하지 않는다.
  # 13.2.1-distroless에서 이 설치가 이미지 안의 bundled Prometheus 플러그인을 업데이트하려다
  # 읽기 전용 bundled 경로와 충돌해 CrashLoop를 일으켰다(as_external 설정 후에도 같았다).
  # 별도 검증 전에는 사용하지 않는다.
  #
  # Grafana 13.2.1-distroless의 기본 자동 업데이트는 bundled plugin을 읽기 전용 이미지
  # 경로에서 갱신하려다 실패한다. 이미 이미지에 들어 있는 plugin을 쓰고, 별도 검증 전에는
  # Pod 기동 시 업데이트하지 않는다.
  grafana.ini:
    plugins:
      preinstall_auto_update: false
  ingress:
    enabled: false
  service:
    type: ClusterIP
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi
  sidecar:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  affinity: &home_workers
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-worker1
                  - k8s-worker2

kubeStateMetrics:
  enabled: true

kube-state-metrics:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  affinity: *home_workers

nodeExporter:
  enabled: true

# 컨트롤 플레인과 GPU 노드도 host CPU·메모리·디스크 기준선이 있어야 한다. GPU 노드는
# DCGM GPU 지표와 같은 시각에 비교하기 위해서이고, 컨트롤 플레인은 etcd·API 서버가 도는
# 노드의 부하를 따로 봐야 하기 때문이다. 두 노드의 전용 taint를 허용하되 hostname을
# 명시해 다른 노드에는 퍼지지 않게 한다. DCGM exporter는 별도 Application이 담당한다.
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k8s-cp
                  - k8s-worker1
                  - k8s-worker2
                  - persona-gpu-01
  # tailscaled가 켠 src_valid_mark(1이면 Cilium DNS 프록시 패킷이 조용히 버려진다)가 다시
  # 켜졌는지 기록한다. 지표는 node_sysctl_net_ipv4_conf_all_src_valid_mark. 노드에 파일이나
  # 타이머를 두지 않고 저장소 선언 한 줄로 끝내려고 textfile 대신 sysctl collector를 쓴다.
  # `extraArgs`는 목록이라 차트 기본값과 병합되지 않고 통째로 바뀐다. 기본값에 들어 있던
  # filesystem 제외 인자 두 개를 그대로 다시 적는다(빠뜨리면 컨테이너 overlay·kubelet 마운트가
  # 지표에 섞여 들어온다). 차트 버전을 올릴 때 이 두 줄이 기본값과 같은지 helm template로 비교한다.
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|run/containerd/.+|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
    - --collector.sysctl
    - --collector.sysctl.include=net.ipv4.conf.all.src_valid_mark
  # Helm 목록 값은 병합되지 않고 통째로 바뀐다. 그래서 허용할 taint를 모두 여기에 적는다.
  tolerations:
    - key: personaruntime.xyz/dedicated
      operator: Equal
      value: gpu-serving
      effect: NoSchedule
    # 위 hostname에 k8s-cp가 있으므로 control-plane taint도 허용해야 실제로 배치된다.
    # 허용하지 않으면 대상인데도 Pod가 뜨지 않아 k8s-cp의 :9100 대상이 비어 있게 된다.
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  affinity: *home_workers
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 50m
        memory: 50Mi
      limits:
        cpu: 100m
        memory: 100Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          cpu: 100m
          memory: 128Mi

prometheus:
  enabled: true
  service:
    type: ClusterIP
  prometheusSpec:
    replicas: 1
    scrapeInterval: 15s
    retention: 7d
    retentionSize: 15GB
    nodeSelector:
      kubernetes.io/hostname: k8s-worker2
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi
